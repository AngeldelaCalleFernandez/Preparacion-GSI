<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Calidad de producto y evidencia</title><desc id="d">Las nueve características ISO IEC 25010 de 2023 se convierten en requisitos, métricas, pruebas, gates, evaluación y mejora.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="500" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Calidad: del atributo abstracto a una decisión basada en evidencia</text><rect class="b x" x="35" y="80" width="1030" height="120" rx="15"/><text class="t" x="550" y="112" text-anchor="middle">ISO/IEC 25010:2023 · nueve características</text><text class="s" x="550" y="143" text-anchor="middle">adecuación funcional · eficiencia · compatibilidad · interacción · fiabilidad</text><text class="s" x="550" y="171" text-anchor="middle">seguridad · mantenibilidad · flexibilidad · safety</text><path class="l" d="M550 200V240M550 240H175V275M550 240H425V275M550 240H675V275M550 240H925V275"/><rect class="b" x="50" y="275" width="250" height="110" rx="14"/><text class="t" x="175" y="310" text-anchor="middle">Requisito medible</text><text class="s" x="175" y="340" text-anchor="middle">umbral · contexto · periodo</text><text class="s" x="175" y="364" text-anchor="middle">criterio de aceptación</text><rect class="b z" x="325" y="275" width="200" height="110" rx="14"/><text class="t" x="425" y="310" text-anchor="middle">Medida</text><text class="s" x="425" y="340" text-anchor="middle">unidad y población</text><text class="s" x="425" y="364" text-anchor="middle">objetivo y tendencia</text><rect class="b" x="550" y="275" width="250" height="110" rx="14"/><text class="t" x="675" y="310" text-anchor="middle">Prueba y gate</text><text class="s" x="675" y="340" text-anchor="middle">producto · proceso · servicio</text><text class="s" x="675" y="364" text-anchor="middle">QA previene · QC evalúa</text><rect class="b y" x="825" y="275" width="225" height="110" rx="14"/><text class="t" x="937" y="310" text-anchor="middle">Evaluar y mejorar</text><text class="s" x="937" y="340" text-anchor="middle">aceptar · corregir</text><text class="s" x="937" y="364" text-anchor="middle">RCA · retrospectiva</text><text class="s" x="550" y="445" text-anchor="middle">Cobertura, líneas de código o complejidad aisladas no miden por sí solas la calidad total.</text></svg>
