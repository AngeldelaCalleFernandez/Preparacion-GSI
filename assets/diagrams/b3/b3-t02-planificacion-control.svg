<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Planificación y control del desarrollo</title><desc id="d">Flujo desde alcance y EDT o backlog hasta estimación, ejecución, métricas, previsión y control de cambios en enfoques predictivos y adaptativos.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.p{fill:#dbeafe;stroke:#1d4ed8}.q{fill:#dcfce7;stroke:#15803d}.w{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="44" text-anchor="middle">Planificar → medir → prever → decidir</text><path class="l" d="M180 160H220M370 160H410M560 160H600M750 160H790M940 160H980M1040 210V285M980 335H890M740 335H650M500 335H410M260 335H180"/><rect class="b p" x="30" y="110" width="150" height="100" rx="14"/><text class="t" x="105" y="146" text-anchor="middle">Alcance</text><text class="s" x="105" y="173" text-anchor="middle">EDT o backlog</text><rect class="b" x="220" y="110" width="150" height="100" rx="14"/><text class="t" x="295" y="146" text-anchor="middle">Estimar</text><text class="s" x="295" y="173" text-anchor="middle">esfuerzo y coste</text><rect class="b" x="410" y="110" width="150" height="100" rx="14"/><text class="t" x="485" y="146" text-anchor="middle">Secuenciar</text><text class="s" x="485" y="173" text-anchor="middle">dependencias</text><rect class="b p" x="600" y="110" width="150" height="100" rx="14"/><text class="t" x="675" y="146" text-anchor="middle">Comprometer</text><text class="s" x="675" y="173" text-anchor="middle">línea base / sprint</text><rect class="b q" x="790" y="110" width="150" height="100" rx="14"/><text class="t" x="865" y="146" text-anchor="middle">Ejecutar</text><text class="s" x="865" y="173" text-anchor="middle">entregar evidencia</text><rect class="b" x="980" y="110" width="90" height="100" rx="14"/><text class="t" x="1025" y="146" text-anchor="middle">Medir</text><text class="s" x="1025" y="173" text-anchor="middle">EV/flujo</text><rect class="b w" x="890" y="285" width="180" height="100" rx="14"/><text class="t" x="980" y="321" text-anchor="middle">Prever</text><text class="s" x="980" y="348" text-anchor="middle">desvío y tendencia</text><rect class="b w" x="650" y="285" width="180" height="100" rx="14"/><text class="t" x="740" y="321" text-anchor="middle">Analizar cambio</text><text class="s" x="740" y="348" text-anchor="middle">impacto y riesgo</text><rect class="b p" x="410" y="285" width="180" height="100" rx="14"/><text class="t" x="500" y="321" text-anchor="middle">Decidir</text><text class="s" x="500" y="348" text-anchor="middle">aceptar o replanificar</text><rect class="b" x="180" y="285" width="180" height="100" rx="14"/><text class="t" x="270" y="321" text-anchor="middle">Aprender</text><text class="s" x="270" y="348" text-anchor="middle">riesgos y retrospectiva</text><rect class="b" x="30" y="285" width="150" height="100" rx="14"/><text class="t" x="105" y="321" text-anchor="middle">Actualizar</text><text class="s" x="105" y="348" text-anchor="middle">plan y backlog</text><text class="s" x="550" y="440" text-anchor="middle">Predictivo: alcance, plazo y coste contra línea base · Adaptativo: valor, flujo y objetivo de producto</text></svg>
