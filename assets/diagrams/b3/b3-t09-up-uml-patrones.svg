<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">Proceso Unificado, UML y patrones</title><desc id="d">Separación entre las fases del Proceso Unificado, la selección de diagramas UML y patrones de diseño por intención.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 19px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Proceso, lenguaje y patrón cumplen funciones diferentes</text><rect class="b x" x="35" y="85" width="1010" height="100" rx="15"/><text class="t" x="110" y="121">UP</text><text class="s" x="110" y="150">organiza trabajo</text><path class="l" d="M245 135H940"/><circle cx="300" cy="135" r="18" fill="#1d4ed8"/><circle cx="500" cy="135" r="18" fill="#1d4ed8"/><circle cx="700" cy="135" r="18" fill="#1d4ed8"/><circle cx="900" cy="135" r="18" fill="#1d4ed8"/><text class="s" x="300" y="171" text-anchor="middle">Inicio</text><text class="s" x="500" y="171" text-anchor="middle">Elaboración</text><text class="s" x="700" y="171" text-anchor="middle">Construcción</text><text class="s" x="900" y="171" text-anchor="middle">Transición</text><rect class="b y" x="35" y="215" width="490" height="180" rx="15"/><text class="t" x="280" y="251" text-anchor="middle">UML comunica la respuesta a una pregunta</text><text class="s" x="280" y="286" text-anchor="middle">actores y objetivos → casos de uso</text><text class="s" x="280" y="314" text-anchor="middle">estructura → clases / componentes</text><text class="s" x="280" y="342" text-anchor="middle">interacción → secuencia</text><text class="s" x="280" y="370" text-anchor="middle">flujo o ciclo → actividad / estados</text><rect class="b z" x="555" y="215" width="490" height="180" rx="15"/><text class="t" x="800" y="251" text-anchor="middle">Patrón expresa intención y trade-off</text><text class="s" x="800" y="286" text-anchor="middle">crear → Factory · adaptar → Adapter</text><text class="s" x="800" y="314" text-anchor="middle">simplificar → Facade · variar → Strategy</text><text class="s" x="800" y="342" text-anchor="middle">notificar → Observer · encapsular → Command</text><text class="s" x="800" y="370" text-anchor="middle">comportamiento por estado → State</text><text class="s" x="540" y="442" text-anchor="middle">El análisis modela el dominio; el diseño introduce tecnología, interfaces, responsabilidades y consecuencias.</text></svg>
