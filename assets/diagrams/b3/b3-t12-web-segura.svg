<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="t d"><title id="t">Arquitectura web segura</title><desc id="d">Flujo de una petición desde navegador a CDN, servidor, API y datos con controles de transporte, estado, navegador, autorización, validación y observabilidad.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1120" height="490" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Cada control protege una frontera distinta</text><path class="l" d="M200 165H240M400 165H440M600 165H640M800 165H840M1000 165H1040"/><rect class="b x" x="30" y="100" width="170" height="130" rx="14"/><text class="t" x="115" y="136" text-anchor="middle">Navegador</text><text class="s" x="115" y="166" text-anchor="middle">HTML · CSS · JS</text><text class="s" x="115" y="192" text-anchor="middle">cookies / token</text><rect class="b" x="240" y="100" width="160" height="130" rx="14"/><text class="t" x="320" y="136" text-anchor="middle">Borde</text><text class="s" x="320" y="166" text-anchor="middle">TLS · CDN</text><text class="s" x="320" y="192" text-anchor="middle">caché · rate limit</text><rect class="b z" x="440" y="100" width="160" height="130" rx="14"/><text class="t" x="520" y="136" text-anchor="middle">Servidor / API</text><text class="s" x="520" y="166" text-anchor="middle">routing · contrato</text><text class="s" x="520" y="192" text-anchor="middle">validación · authz</text><rect class="b" x="640" y="100" width="160" height="130" rx="14"/><text class="t" x="720" y="136" text-anchor="middle">Dominio</text><text class="s" x="720" y="166" text-anchor="middle">reglas · jobs</text><text class="s" x="720" y="192" text-anchor="middle">mensajería</text><rect class="b y" x="840" y="100" width="160" height="130" rx="14"/><text class="t" x="920" y="136" text-anchor="middle">Datos</text><text class="s" x="920" y="166" text-anchor="middle">consulta parametrizada</text><text class="s" x="920" y="192" text-anchor="middle">integridad · cifrado</text><rect class="b" x="1040" y="100" width="60" height="130" rx="14"/><text class="t" x="1070" y="145" text-anchor="middle">Ext.</text><text class="s" x="1070" y="178" text-anchor="middle">API</text><rect class="b x" x="55" y="285" width="320" height="110" rx="14"/><text class="t" x="215" y="319" text-anchor="middle">Controles del navegador</text><text class="s" x="215" y="348" text-anchor="middle">SOP · CORS · CSP · CSRF · Secure/HttpOnly</text><text class="s" x="215" y="372" text-anchor="middle">CORS declara orígenes; no autentica.</text><rect class="b z" x="400" y="285" width="320" height="110" rx="14"/><text class="t" x="560" y="319" text-anchor="middle">Identidad y sesión</text><text class="s" x="560" y="348" text-anchor="middle">OAuth 2 autorización · OIDC identidad</text><text class="s" x="560" y="372" text-anchor="middle">JWT es formato; validar firma y claims.</text><rect class="b y" x="745" y="285" width="320" height="110" rx="14"/><text class="t" x="905" y="319" text-anchor="middle">Calidad operativa</text><text class="s" x="905" y="348" text-anchor="middle">logs · métricas · trazas · p95/p99</text><text class="s" x="905" y="372" text-anchor="middle">i18n · accesibilidad · responsive</text><text class="s" x="560" y="450" text-anchor="middle">HTTPS protege el canal, pero no corrige control de acceso, inyección, XSS ni configuración insegura.</text></svg>
