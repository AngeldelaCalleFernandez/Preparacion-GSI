<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="t d"><title id="t">Cutover y sustitución de sistemas</title><desc id="d">Secuencia de transición con ensayo, congelación, copia, migración, validación, decisión, arranque, hypercare y revisión, junto con cuatro estrategias de sustitución.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fee2e2;stroke:#b91c1c}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 16px Arial;fill:#0f172a}.s{font:13px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1120" height="480" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">La implantación debe ser ensayada, verificable y reversible</text><path class="l" d="M145 145H165M285 145H305M425 145H445M565 145H585M705 145H725M845 145H865M985 145H1005"/><g><rect class="b" x="25" y="95" width="120" height="100" rx="12"/><text class="t" x="85" y="132" text-anchor="middle">Ensayo</text><text class="s" x="85" y="160" text-anchor="middle">dry-run</text><rect class="b" x="165" y="95" width="120" height="100" rx="12"/><text class="t" x="225" y="132" text-anchor="middle">Freeze</text><text class="s" x="225" y="160" text-anchor="middle">comunicar</text><rect class="b" x="305" y="95" width="120" height="100" rx="12"/><text class="t" x="365" y="132" text-anchor="middle">Backup</text><text class="s" x="365" y="160" text-anchor="middle">restaurable</text><rect class="b x" x="445" y="95" width="120" height="100" rx="12"/><text class="t" x="505" y="132" text-anchor="middle">Migrar</text><text class="s" x="505" y="160" text-anchor="middle">transformar</text><rect class="b x" x="585" y="95" width="120" height="100" rx="12"/><text class="t" x="645" y="132" text-anchor="middle">Conciliar</text><text class="s" x="645" y="160" text-anchor="middle">conteos · reglas</text><rect class="b z" x="725" y="95" width="120" height="100" rx="12"/><text class="t" x="785" y="132" text-anchor="middle">Go / no-go</text><text class="s" x="785" y="160" text-anchor="middle">rollback</text><rect class="b y" x="865" y="95" width="120" height="100" rx="12"/><text class="t" x="925" y="132" text-anchor="middle">Arrancar</text><text class="s" x="925" y="160" text-anchor="middle">smoke tests</text><rect class="b y" x="1005" y="95" width="90" height="100" rx="12"/><text class="t" x="1050" y="132" text-anchor="middle">Cuidar</text><text class="s" x="1050" y="160" text-anchor="middle">hypercare</text></g><text class="t" x="560" y="250" text-anchor="middle">Elegir estrategia según riesgo, coexistencia y coste</text><rect class="b z" x="45" y="285" width="235" height="105" rx="14"/><text class="t" x="162" y="319" text-anchor="middle">Big bang</text><text class="s" x="162" y="347" text-anchor="middle">rápida · máximo riesgo</text><rect class="b x" x="305" y="285" width="235" height="105" rx="14"/><text class="t" x="422" y="319" text-anchor="middle">Paralela</text><text class="s" x="422" y="347" text-anchor="middle">respaldo · doble operación</text><rect class="b y" x="565" y="285" width="235" height="105" rx="14"/><text class="t" x="682" y="319" text-anchor="middle">Piloto</text><text class="s" x="682" y="347" text-anchor="middle">aprendizaje · representatividad</text><rect class="b" x="825" y="285" width="235" height="105" rx="14"/><text class="t" x="942" y="319" text-anchor="middle">Por fases</text><text class="s" x="942" y="347" text-anchor="middle">menor impacto · coexistencia</text><text class="s" x="560" y="440" text-anchor="middle">La revisión postimplantación mide operación, adopción, coste, beneficios, incidencias y deuda residual.</text></svg>
