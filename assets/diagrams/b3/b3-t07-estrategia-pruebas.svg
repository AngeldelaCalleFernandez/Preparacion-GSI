<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Estrategia integral de pruebas</title><desc id="d">Matriz de objetos, niveles, técnicas, datos y tipos de prueba que conduce a defectos, criterios de salida y aceptación.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="44" text-anchor="middle">Probar por riesgo exige combinar varios ejes</text><rect class="b x" x="35" y="90" width="240" height="135" rx="14"/><text class="t" x="155" y="126" text-anchor="middle">Objeto</text><text class="s" x="155" y="157" text-anchor="middle">software · hardware</text><text class="s" x="155" y="184" text-anchor="middle">datos · procedimientos</text><rect class="b" x="300" y="90" width="240" height="135" rx="14"/><text class="t" x="420" y="126" text-anchor="middle">Nivel</text><text class="s" x="420" y="157" text-anchor="middle">unidad · integración</text><text class="s" x="420" y="184" text-anchor="middle">sistema · aceptación</text><rect class="b" x="565" y="90" width="240" height="135" rx="14"/><text class="t" x="685" y="126" text-anchor="middle">Técnica</text><text class="s" x="685" y="157" text-anchor="middle">equivalencia · límites · estados</text><text class="s" x="685" y="184" text-anchor="middle">sentencias · ramas · exploratoria</text><rect class="b z" x="830" y="90" width="235" height="135" rx="14"/><text class="t" x="947" y="126" text-anchor="middle">Tipo</text><text class="s" x="947" y="157" text-anchor="middle">funcional · rendimiento</text><text class="s" x="947" y="184" text-anchor="middle">seguridad · accesibilidad</text><path class="l" d="M155 225V270H947V225"/><rect class="b" x="90" y="270" width="280" height="115" rx="14"/><text class="t" x="230" y="306" text-anchor="middle">Preparación</text><text class="s" x="230" y="335" text-anchor="middle">entorno · datos versionados</text><text class="s" x="230" y="360" text-anchor="middle">precondiciones · resultado esperado</text><rect class="b y" x="410" y="270" width="280" height="115" rx="14"/><text class="t" x="550" y="306" text-anchor="middle">Ejecución y defectos</text><text class="s" x="550" y="335" text-anchor="middle">severidad ≠ prioridad</text><text class="s" x="550" y="360" text-anchor="middle">retest ≠ regresión</text><rect class="b x" x="730" y="270" width="280" height="115" rx="14"/><text class="t" x="870" y="306" text-anchor="middle">Salida y aceptación</text><text class="s" x="870" y="335" text-anchor="middle">cobertura · defectos abiertos</text><text class="s" x="870" y="360" text-anchor="middle">evidencia · riesgo residual</text><text class="s" x="550" y="435" text-anchor="middle">100 % de cobertura de líneas no demuestra ausencia de defectos ni cobertura de requisitos.</text></svg>
