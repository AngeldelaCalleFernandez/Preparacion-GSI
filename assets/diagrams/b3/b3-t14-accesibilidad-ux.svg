<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Accesibilidad, usabilidad y experiencia de usuario</title><desc id="d">Ciclo de diseño y evaluación accesible desde investigación y requisitos hasta publicación, declaración y monitorización, guiado por POUR.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="500" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Accesibilidad integrada: diseñar, verificar y mantener</text><path class="l" d="M175 160H205M335 160H365M495 160H525M655 160H685M815 160H845M975 160H1010M1055 210V275M1010 325H920M790 325H700M570 325H480M350 325H260M130 275V210"/><g><rect class="b x" x="45" y="110" width="130" height="100" rx="13"/><text class="t" x="110" y="146" text-anchor="middle">Investigar</text><text class="s" x="110" y="174" text-anchor="middle">personas y tareas</text><rect class="b" x="205" y="110" width="130" height="100" rx="13"/><text class="t" x="270" y="146" text-anchor="middle">Requisitos</text><text class="s" x="270" y="174" text-anchor="middle">criterios y contexto</text><rect class="b z" x="365" y="110" width="130" height="100" rx="13"/><text class="t" x="430" y="146" text-anchor="middle">Diseñar</text><text class="s" x="430" y="174" text-anchor="middle">semántica · flujos</text><rect class="b" x="525" y="110" width="130" height="100" rx="13"/><text class="t" x="590" y="146" text-anchor="middle">Construir</text><text class="s" x="590" y="174" text-anchor="middle">teclado · foco</text><rect class="b" x="685" y="110" width="130" height="100" rx="13"/><text class="t" x="750" y="146" text-anchor="middle">Automatizar</text><text class="s" x="750" y="174" text-anchor="middle">reglas detectables</text><rect class="b x" x="845" y="110" width="130" height="100" rx="13"/><text class="t" x="910" y="146" text-anchor="middle">Revisar</text><text class="s" x="910" y="174" text-anchor="middle">manual y ayudas</text><rect class="b y" x="1010" y="110" width="90" height="100" rx="13"/><text class="t" x="1055" y="146" text-anchor="middle">Probar</text><text class="s" x="1055" y="174" text-anchor="middle">usuarios</text></g><rect class="b y" x="920" y="275" width="180" height="100" rx="13"/><text class="t" x="1010" y="311" text-anchor="middle">Publicar</text><text class="s" x="1010" y="339" text-anchor="middle">declaración y canal</text><rect class="b" x="700" y="275" width="180" height="100" rx="13"/><text class="t" x="790" y="311" text-anchor="middle">Monitorizar</text><text class="s" x="790" y="339" text-anchor="middle">contenido y cambios</text><rect class="b z" x="480" y="275" width="180" height="100" rx="13"/><text class="t" x="570" y="311" text-anchor="middle">Usabilidad</text><text class="s" x="570" y="339" text-anchor="middle">eficacia · eficiencia</text><rect class="b z" x="260" y="275" width="180" height="100" rx="13"/><text class="t" x="350" y="311" text-anchor="middle">UX</text><text class="s" x="350" y="339" text-anchor="middle">experiencia global</text><rect class="b x" x="30" y="275" width="190" height="100" rx="13"/><text class="t" x="125" y="311" text-anchor="middle">POUR</text><text class="s" x="125" y="339" text-anchor="middle">percibir · operar</text><text class="s" x="125" y="360" text-anchor="middle">comprender · robustez</text><text class="s" x="550" y="445" text-anchor="middle">WCAG 2.2 es recomendación W3C; la obligación jurídica se contrasta con la norma armonizada aplicable.</text></svg>
