<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" role="img" aria-labelledby="t d"><title id="t">Trazabilidad de requisitos</title><desc id="d">Cadena desde necesidades y legado hasta elicitación, especificación, priorización, diseño, implementación, pruebas y entrega.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="470" rx="22"/><text class="h" x="550" y="44" text-anchor="middle">Cada requisito nace de una necesidad y termina en evidencia</text><path class="l" d="M180 170H215M355 170H390M530 170H565M705 170H740M880 170H915"/><rect class="b x" x="30" y="100" width="150" height="140" rx="14"/><text class="t" x="105" y="136" text-anchor="middle">Fuentes</text><text class="s" x="105" y="168" text-anchor="middle">stakeholders</text><text class="s" x="105" y="192" text-anchor="middle">legado · normas</text><text class="s" x="105" y="216" text-anchor="middle">datos · interfaces</text><rect class="b" x="215" y="100" width="140" height="140" rx="14"/><text class="t" x="285" y="136" text-anchor="middle">Elicitar</text><text class="s" x="285" y="168" text-anchor="middle">entrevista</text><text class="s" x="285" y="192" text-anchor="middle">observación</text><text class="s" x="285" y="216" text-anchor="middle">prototipo</text><rect class="b z" x="390" y="100" width="140" height="140" rx="14"/><text class="t" x="460" y="136" text-anchor="middle">Analizar</text><text class="s" x="460" y="168" text-anchor="middle">conflictos</text><text class="s" x="460" y="192" text-anchor="middle">reglas y excepciones</text><text class="s" x="460" y="216" text-anchor="middle">as-is / to-be</text><rect class="b x" x="565" y="100" width="140" height="140" rx="14"/><text class="t" x="635" y="136" text-anchor="middle">Especificar</text><text class="s" x="635" y="168" text-anchor="middle">SRS · NFR</text><text class="s" x="635" y="192" text-anchor="middle">interfaces · datos</text><text class="s" x="635" y="216" text-anchor="middle">aceptación</text><rect class="b" x="740" y="100" width="140" height="140" rx="14"/><text class="t" x="810" y="136" text-anchor="middle">Priorizar</text><text class="s" x="810" y="168" text-anchor="middle">valor · riesgo</text><text class="s" x="810" y="192" text-anchor="middle">coste · obligación</text><rect class="b y" x="915" y="100" width="155" height="140" rx="14"/><text class="t" x="992" y="136" text-anchor="middle">Validar</text><text class="s" x="992" y="168" text-anchor="middle">usuarios</text><text class="s" x="992" y="192" text-anchor="middle">claridad y viabilidad</text><path class="l" d="M992 240V320H140"/><rect class="b" x="140" y="300" width="820" height="90" rx="14"/><text class="t" x="550" y="332" text-anchor="middle">Trazabilidad bidireccional</text><text class="s" x="550" y="360" text-anchor="middle">necesidad ↔ requisito ↔ diseño ↔ código ↔ prueba ↔ versión desplegada</text><text class="s" x="550" y="430" text-anchor="middle">Cambiar exige analizar impacto, decidir, versionar y actualizar pruebas y documentación.</text></svg>
