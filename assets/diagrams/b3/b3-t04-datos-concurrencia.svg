<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d"><title id="t">Diseño de datos y concurrencia</title><desc id="d">Paso del modelo conceptual al lógico y físico, con integridad y técnicas para controlar anomalías concurrentes.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fee2e2;stroke:#b91c1c}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1080" height="470" rx="22"/><text class="h" x="540" y="44" text-anchor="middle">Semántica primero; optimización y concurrencia después</text><path class="l" d="M250 155H300M500 155H550M750 155H800"/><rect class="b x" x="50" y="95" width="200" height="120" rx="14"/><text class="t" x="150" y="132" text-anchor="middle">Conceptual</text><text class="s" x="150" y="162" text-anchor="middle">entidades · relaciones</text><text class="s" x="150" y="187" text-anchor="middle">reglas del negocio</text><rect class="b" x="300" y="95" width="200" height="120" rx="14"/><text class="t" x="400" y="132" text-anchor="middle">Lógico</text><text class="s" x="400" y="162" text-anchor="middle">tablas · PK/FK</text><text class="s" x="400" y="187" text-anchor="middle">normalización</text><rect class="b y" x="550" y="95" width="200" height="120" rx="14"/><text class="t" x="650" y="132" text-anchor="middle">Físico</text><text class="s" x="650" y="162" text-anchor="middle">tipos · índices</text><text class="s" x="650" y="187" text-anchor="middle">particiones · motor</text><rect class="b z" x="800" y="95" width="230" height="120" rx="14"/><text class="t" x="915" y="132" text-anchor="middle">Transacciones</text><text class="s" x="915" y="162" text-anchor="middle">ACID · aislamiento</text><text class="s" x="915" y="187" text-anchor="middle">consistencia observable</text><path class="l" d="M915 215V270"/><rect class="b z" x="610" y="270" width="420" height="120" rx="14"/><text class="t" x="820" y="306" text-anchor="middle">Anomalías a controlar</text><text class="s" x="820" y="336" text-anchor="middle">sucia · no repetible · fantasma · actualización perdida</text><text class="s" x="820" y="363" text-anchor="middle">deadlock: prevenir, detectar, abortar y reintentar con seguridad</text><rect class="b x" x="50" y="270" width="510" height="120" rx="14"/><text class="t" x="305" y="306" text-anchor="middle">Estrategias</text><text class="s" x="305" y="336" text-anchor="middle">bloqueo pesimista · MVCC · control optimista</text><text class="s" x="305" y="363" text-anchor="middle">elegir según colisión, latencia y requisitos de aislamiento</text><text class="s" x="540" y="435" text-anchor="middle">Un índice acelera ciertos accesos, pero cuesta escritura y no sustituye integridad ni buen diseño.</text></svg>
