<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="t d"><title id="t">Pipeline de integración y entrega</title><desc id="d">Flujo de código a producción con build reproducible, pruebas, controles, artefacto inmutable, promoción, despliegue y operación documentada.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 16px Arial;fill:#0f172a}.s{font:13px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1120" height="470" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Un cambio se convierte en un artefacto trazable y operable</text><path class="l" d="M145 160H170M285 160H310M425 160H450M565 160H590M705 160H730M845 160H870M985 160H1010"/><rect class="b x" x="20" y="105" width="125" height="110" rx="13"/><text class="t" x="82" y="143" text-anchor="middle">Commit</text><text class="s" x="82" y="171" text-anchor="middle">review · rama</text><rect class="b" x="170" y="105" width="115" height="110" rx="13"/><text class="t" x="227" y="143" text-anchor="middle">Build</text><text class="s" x="227" y="171" text-anchor="middle">reproducible</text><rect class="b" x="310" y="105" width="115" height="110" rx="13"/><text class="t" x="367" y="143" text-anchor="middle">Pruebas</text><text class="s" x="367" y="171" text-anchor="middle">unit · integración</text><rect class="b z" x="450" y="105" width="115" height="110" rx="13"/><text class="t" x="507" y="143" text-anchor="middle">Gates</text><text class="s" x="507" y="171" text-anchor="middle">SAST · SCA · IaC</text><rect class="b x" x="590" y="105" width="115" height="110" rx="13"/><text class="t" x="647" y="143" text-anchor="middle">Artefacto</text><text class="s" x="647" y="171" text-anchor="middle">firma · SBOM</text><rect class="b" x="730" y="105" width="115" height="110" rx="13"/><text class="t" x="787" y="143" text-anchor="middle">Promover</text><text class="s" x="787" y="171" text-anchor="middle">test → pre → prod</text><rect class="b y" x="870" y="105" width="115" height="110" rx="13"/><text class="t" x="927" y="143" text-anchor="middle">Desplegar</text><text class="s" x="927" y="171" text-anchor="middle">canary · rolling</text><rect class="b y" x="1010" y="105" width="90" height="110" rx="13"/><text class="t" x="1055" y="143" text-anchor="middle">Operar</text><text class="s" x="1055" y="171" text-anchor="middle">observar</text><path class="l" d="M1055 215V280H800"/><rect class="b" x="560" y="280" width="480" height="105" rx="14"/><text class="t" x="800" y="314" text-anchor="middle">Feedback y reversión</text><text class="s" x="800" y="342" text-anchor="middle">health checks · métricas · logs · trazas · rollback/roll-forward</text><text class="s" x="800" y="366" text-anchor="middle">migraciones compatibles y secretos externos</text><rect class="b z" x="80" y="280" width="420" height="105" rx="14"/><text class="t" x="290" y="314" text-anchor="middle">Transición de conocimiento</text><text class="s" x="290" y="342" text-anchor="middle">arquitectura · API · runbook · manuales</text><text class="s" x="290" y="366" text-anchor="middle">formación por perfiles y práctica evaluada</text><text class="s" x="560" y="432" text-anchor="middle">Delivery mantiene desplegable; Deployment publica automáticamente tras superar controles.</text></svg>
