<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="t d"><title id="t">Modelos de ciclo de vida</title><desc id="d">Comparación entre cascada, modelo en V, incremental e iterativo y espiral según secuencia, pruebas, feedback y riesgo.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.a{fill:#dbeafe;stroke:#1d4ed8}.e{fill:#dcfce7;stroke:#15803d}.r{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 19px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="500" rx="22"/><text class="h" x="540" y="44" text-anchor="middle">Mismas actividades, distinta relación entre ellas</text><rect class="b" x="40" y="90" width="230" height="300" rx="16"/><text class="t" x="155" y="128" text-anchor="middle">Cascada</text><path class="l" d="M80 170H230M100 215H210M120 260H190M140 305H170"/><text class="s" x="155" y="345" text-anchor="middle">secuencia e hitos</text><text class="s" x="155" y="368" text-anchor="middle">feedback tardío</text><rect class="b a" x="300" y="90" width="230" height="300" rx="16"/><text class="t" x="415" y="128" text-anchor="middle">Modelo en V</text><path class="l" d="M340 170L415 300L490 170M365 210H465M390 255H440"/><text class="s" x="415" y="345" text-anchor="middle">especificación ↔ prueba</text><text class="s" x="415" y="368" text-anchor="middle">trazabilidad fuerte</text><rect class="b e" x="560" y="90" width="230" height="300" rx="16"/><text class="t" x="675" y="128" text-anchor="middle">Iterativo / incremental</text><path class="l" d="M620 205a55 55 0 1 1 15 64M635 269l-30 4 10-29"/><text class="s" x="675" y="345" text-anchor="middle">entrega + aprendizaje</text><text class="s" x="675" y="368" text-anchor="middle">capacidad por ciclos</text><rect class="b r" x="820" y="90" width="220" height="300" rx="16"/><text class="t" x="930" y="128" text-anchor="middle">Espiral</text><path class="l" d="M930 245c0-80 100-70 80 20-25 110-175 95-165-45 12-170 230-180 245 15"/><text class="s" x="930" y="345" text-anchor="middle">riesgo dirige el ciclo</text><text class="s" x="930" y="368" text-anchor="middle">explorar antes de comprometer</text><rect class="b" x="210" y="420" width="660" height="50" rx="12"/><text class="s" x="540" y="451" text-anchor="middle">Viabilidad · requisitos · diseño · construcción · pruebas · operación · retirada</text></svg>
