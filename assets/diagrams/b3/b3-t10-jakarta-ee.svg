<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="t d"><title id="t">Arquitectura Jakarta EE 11</title><desc id="d">Capas y especificaciones Jakarta EE 11, perfiles Core, Web y Platform, sobre Java 17 o superior.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="490" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Jakarta EE 11: especificaciones integradas por un runtime</text><rect class="b" x="70" y="80" width="940" height="62" rx="14"/><text class="t" x="540" y="107" text-anchor="middle">Cliente / API / navegador</text><text class="s" x="540" y="130" text-anchor="middle">HTTP · JSON · WebSocket · mensajería</text><path class="l" d="M540 142V175"/><rect class="b x" x="70" y="175" width="940" height="62" rx="14"/><text class="t" x="540" y="202" text-anchor="middle">Entrada web</text><text class="s" x="540" y="225" text-anchor="middle">Servlet 6.1 · REST 4.0 · Faces 4.1 · Validation 3.1</text><path class="l" d="M540 237V270"/><rect class="b z" x="70" y="270" width="940" height="62" rx="14"/><text class="t" x="540" y="297" text-anchor="middle">Servicios y contexto</text><text class="s" x="540" y="320" text-anchor="middle">CDI 4.1 · Security 4.0 · Transactions 2.0 · Concurrency 3.1</text><path class="l" d="M540 332V365"/><rect class="b y" x="70" y="365" width="940" height="62" rx="14"/><text class="t" x="540" y="392" text-anchor="middle">Datos e integración</text><text class="s" x="540" y="415" text-anchor="middle">Persistence 3.2 · Data 1.0 · Messaging 3.1 · Connectors 2.1</text><rect class="b" x="20" y="155" width="36" height="292" rx="16"/><text class="s" x="38" y="304" transform="rotate(-90 38 304)" text-anchor="middle">Core ⊂ Web ⊂ Platform</text><rect class="b" x="1024" y="155" width="36" height="292" rx="16"/><text class="s" x="1042" y="304" transform="rotate(90 1042 304)" text-anchor="middle">Runtime compatible</text><text class="s" x="540" y="467" text-anchor="middle">Java SE 17+ · mejoras con Java 21 · especificación ≠ implementación ≠ herramienta de build</text></svg>
