<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="t d"><title id="t">Plataforma moderna de datos</title><desc id="d">Arquitectura desde fuentes e ingesta batch o streaming hasta almacenamiento, procesamiento Hadoop o Spark, gobierno y consumos OLAP, minería e IA o NoSQL.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.w{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1120" height="500" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">De los datos al valor: arquitectura justificada por requisitos</text><path class="l" d="M200 190H245M405 190H450M650 190H695M895 190H940"/><rect class="b x" x="30" y="100" width="170" height="180" rx="15"/><text class="t" x="115" y="137" text-anchor="middle">Fuentes</text><text class="s" x="115" y="171" text-anchor="middle">transacciones</text><text class="s" x="115" y="199" text-anchor="middle">ficheros · APIs</text><text class="s" x="115" y="227" text-anchor="middle">sensores · eventos</text><rect class="b" x="245" y="100" width="160" height="180" rx="15"/><text class="t" x="325" y="137" text-anchor="middle">Ingesta</text><text class="s" x="325" y="171" text-anchor="middle">batch</text><text class="s" x="325" y="199" text-anchor="middle">streaming</text><text class="s" x="325" y="227" text-anchor="middle">event time</text><rect class="b z" x="450" y="100" width="200" height="180" rx="15"/><text class="t" x="550" y="137" text-anchor="middle">Almacenamiento</text><text class="s" x="550" y="171" text-anchor="middle">HDFS · objetos</text><text class="s" x="550" y="199" text-anchor="middle">lake · warehouse</text><text class="s" x="550" y="227" text-anchor="middle">formatos columnares</text><rect class="b w" x="695" y="100" width="200" height="180" rx="15"/><text class="t" x="795" y="137" text-anchor="middle">Procesamiento</text><text class="s" x="795" y="171" text-anchor="middle">MapReduce</text><text class="s" x="795" y="199" text-anchor="middle">Spark · SQL · ML</text><text class="s" x="795" y="227" text-anchor="middle">ventanas y late events</text><rect class="b y" x="940" y="100" width="150" height="180" rx="15"/><text class="t" x="1015" y="137" text-anchor="middle">Consumo</text><text class="s" x="1015" y="171" text-anchor="middle">OLAP · BI</text><text class="s" x="1015" y="199" text-anchor="middle">minería · IA</text><text class="s" x="1015" y="227" text-anchor="middle">API · NoSQL</text><rect class="b x" x="125" y="330" width="870" height="90" rx="15"/><text class="t" x="560" y="362" text-anchor="middle">Gobierno transversal</text><text class="s" x="560" y="391" text-anchor="middle">catálogo · linaje · calidad · seguridad · privacidad · retención · coste · ownership · observabilidad</text><path class="l" d="M560 330V280"/><text class="s" x="560" y="463" text-anchor="middle">NoSQL se elige por modelo de acceso y consistencia; CAP se analiza cuando existe una partición de red.</text></svg>
