<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">Estructuras, algoritmos e inteligencia artificial</title><desc id="d">Mapa desde el problema y sus operaciones hacia estructuras de datos, estrategias algorítmicas y, cuando procede, modelos de inteligencia artificial.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="44" text-anchor="middle">La técnica se elige por el problema y las operaciones dominantes</text><rect class="b" x="365" y="75" width="350" height="78" rx="14"/><text class="t" x="540" y="107" text-anchor="middle">Problema · volumen · restricciones · métrica</text><text class="s" x="540" y="132" text-anchor="middle">tiempo, espacio, exactitud, explicabilidad y coste</text><path class="l" d="M540 153V185M540 185H190V220M540 185V220M540 185H890V220"/><rect class="b x" x="35" y="220" width="310" height="170" rx="15"/><text class="t" x="190" y="255" text-anchor="middle">Estructura de datos</text><text class="s" x="190" y="288" text-anchor="middle">array · lista · pila · cola</text><text class="s" x="190" y="316" text-anchor="middle">hash · árbol · heap · grafo</text><text class="s" x="190" y="354" text-anchor="middle">coste de acceso, inserción y búsqueda</text><rect class="b y" x="385" y="220" width="310" height="170" rx="15"/><text class="t" x="540" y="255" text-anchor="middle">Estrategia algorítmica</text><text class="s" x="540" y="288" text-anchor="middle">divide y vencerás · voraz</text><text class="s" x="540" y="316" text-anchor="middle">programación dinámica · backtracking</text><text class="s" x="540" y="344" text-anchor="middle">branch and bound</text><rect class="b z" x="735" y="220" width="310" height="170" rx="15"/><text class="t" x="890" y="255" text-anchor="middle">Modelo de IA, si aporta valor</text><text class="s" x="890" y="288" text-anchor="middle">datos → entrenamiento → validación</text><text class="s" x="890" y="316" text-anchor="middle">test → inferencia → monitorización</text><text class="s" x="890" y="354" text-anchor="middle">sesgo · privacidad · generalización</text><text class="s" x="540" y="437" text-anchor="middle">Big-O expresa crecimiento; una buena métrica de entrenamiento no garantiza buen comportamiento en producción.</text></svg>
