<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="t d"><title id="t">Plataforma .NET moderna</title><desc id="d">Relación entre lenguajes y SDK, IL y CLR, ASP.NET Core, servicios, persistencia, seguridad, observabilidad y despliegue.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1080" height="490" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">.NET: herramientas, runtime y servicios por responsabilidades</text><path class="l" d="M220 150H270M470 150H520M720 150H770"/><rect class="b x" x="30" y="90" width="190" height="120" rx="14"/><text class="t" x="125" y="127" text-anchor="middle">Código y SDK</text><text class="s" x="125" y="157" text-anchor="middle">C# · F# · VB</text><text class="s" x="125" y="183" text-anchor="middle">dotnet CLI · NuGet</text><rect class="b" x="270" y="90" width="200" height="120" rx="14"/><text class="t" x="370" y="127" text-anchor="middle">IL + metadatos</text><text class="s" x="370" y="157" text-anchor="middle">assembly</text><text class="s" x="370" y="183" text-anchor="middle">CTS · CLS</text><rect class="b z" x="520" y="90" width="200" height="120" rx="14"/><text class="t" x="620" y="127" text-anchor="middle">CLR</text><text class="s" x="620" y="157" text-anchor="middle">JIT/AOT · GC</text><text class="s" x="620" y="183" text-anchor="middle">excepciones · threads</text><rect class="b y" x="770" y="90" width="280" height="120" rx="14"/><text class="t" x="910" y="127" text-anchor="middle">ASP.NET Core</text><