<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">De la selección de alternativas al control del proyecto</title>
  <desc id="desc">Proceso que parte de requisitos y alternativas, usa una matriz y análisis de sensibilidad para decidir, y continúa con EDT, cronograma, presupuesto, valor ganado y control de cambios.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.dec{fill:#dbeafe;stroke:#1d4ed8}.plan{fill:#dcfce7;stroke:#15803d}.ctrl{fill:#fef3c7;stroke:#b45309}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="520" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Elegir con criterios y gobernar con líneas base</text>
  <text class="t" x="300" y="82" text-anchor="middle">Selección de la solución</text><text class="t" x="825" y="82" text-anchor="middle">Planificación y control</text>
  <path class="l" d="M175 155H205M335 155H365M495 155H525M655 155H705M835 155H865M995 155H1030M1080 205V285M1030 335H985M855 335H810M680 335H635M505 335H460"/>
  <rect class="b dec" x="45" y="105" width="130" height="100" rx="13"/><text class="t" x="110" y="141" text-anchor="middle">Requisitos</text><text class="s" x="110" y="168" text-anchor="middle">restricciones</text>
  <rect class="b" x="205" y="105" width="130" height="100" rx="13"/><text class="t" x="270" y="141" text-anchor="middle">Alternativas</text><text class="s" x="270" y="168" text-anchor="middle">incluye no actuar</text>
  <rect class="b" x="365" y="105" width="130" height="100" rx="13"/><text class="t" x="430" y="141" text-anchor="middle">Matriz</text><text class="s" x="430" y="168" text-anchor="middle">criterios y pesos</text>
  <rect class="b" x="525" y="105" width="130" height="100" rx="13"/><text class="t" x="590" y="137" text-anchor="middle">Sensibilidad</text><text class="s" x="590" y="164" text-anchor="middle">¿cambia el orden?</text>
  <rect class="b dec" x="705" y="105" width="130" height="100" rx="13"/><text class="t" x="770" y="141" text-anchor="middle">Decisión</text><text class="s" x="770" y="168" text-anchor="middle">justificada</text>
  <rect class="b plan" x="865" y="105" width="130" height="100" rx="13"/><text class="t" x="930" y="141" text-anchor="middle">EDT</text><text class="s" x="930" y="168" text-anchor="middle">entregables</text>
  <rect class="b plan" x="1030" y="105" width="70" height="100" rx="13"/><text class="t" x="1065" y="140" text-anchor="middle">Red</text><text class="s" x="1065" y="167" text-anchor="middle">CPM</text>
  <rect class="b plan" x="985" y="285" width="115" height="100" rx="13"/><text class="t" x="1042" y="321" text-anchor="middle">Cronograma</text><text class="s" x="1042" y="348" text-anchor="middle">línea base</text>
  <rect class="b plan" x="810" y="285" width="175" height="100" rx="13"/><text class="t" x="897" y="321" text-anchor="middle">Presupuesto</text><text class="s" x="897" y="348" text-anchor="middle">costes y reservas</text>
  <rect class="b ctrl" x="635" y="285" width="175" height="100" rx="13"/><text class="t" x="722" y="321" text-anchor="middle">Valor ganado</text><text class="s" x="722" y="348" text-anchor="middle">PV · EV · AC</text>
  <rect class="b ctrl" x="460" y="285" width="175" height="100" rx="13"/><text class="t" x="547" y="321" text-anchor="middle">Previsión</text><text class="s" x="547" y="348" text-anchor="middle">desvíos y EAC</text>
  <rect class="b ctrl" x="170" y="285" width="290" height="100" rx="13"/><text class="t" x="315" y="321" text-anchor="middle">Control integrado de cambios</text><text class="s" x="315" y="348" text-anchor="middle">evaluar impacto antes de cambiar líneas base</text>
  <path class="l" d="M315 385V445H930V205"/><text class="s" x="560" y="482" text-anchor="middle">Un cambio aprobado actualiza plan, calendario, coste, riesgos y trazabilidad de la decisión.</text>
</svg>
