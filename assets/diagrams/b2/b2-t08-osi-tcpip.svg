<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 820" role="img" aria-labelledby="title desc">
  <title id="title">Correspondencia OSI TCP IP y encapsulación</title><desc id="desc">Siete capas OSI alineadas con cuatro capas TCP IP y sus unidades de datos: datos, segmento o datagrama, paquete, trama y bits.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:33px;font-weight:800}.t{font-size:20px;font-weight:750}.n{font-size:16px}.k{font-size:14px;font-weight:800}.box{stroke:#244f78;stroke-width:2.5}</style>
  <rect width="1250" height="820" rx="24" fill="#f7fbff"/><text x="625" y="52" text-anchor="middle" class="h">OSI ↔ TCP/IP ↔ PDU</text>
  <text x="240" y="95" text-anchor="middle" class="t">Modelo OSI</text><text x="650" y="95" text-anchor="middle" class="t">Pila TCP/IP</text><text x="1020" y="95" text-anchor="middle" class="t">Unidad y ejemplos</text>
  <g transform="translate(70 115)">
    <rect width="340" height="82" fill="#e3efff" class="box"/><text x="170" y="34" text-anchor="middle" class="t">7 · Aplicación</text><text x="170" y="62" text-anchor="middle" class="n">servicios a aplicaciones</text>
    <rect y="82" width="340" height="82" fill="#e3efff" class="box"/><text x="170" y="116" text-anchor="middle" class="t">6 · Presentación</text><text x="170" y="144" text-anchor="middle" class="n">representación</text>
    <rect y="164" width="340" height="82" fill="#e3efff" class="box"/><text x="170" y="198" text-anchor="middle" class="t">5 · Sesión</text><text x="170" y="226" text-anchor="middle" class="n">diálogo</text>
    <rect y="246" width="340" height="105" fill="#e9f5ec" class="box"/><text x="170" y="287" text-anchor="middle" class="t">4 · Transporte</text><text x="170" y="319" text-anchor="middle" class="n">extremo a extremo · puertos</text>
    <rect y="351" width="340" height="105" fill="#fff3d6" class="box"/><text x="170" y="392" text-anchor="middle" class="t">3 · Red</text><text x="170" y="424" text-anchor="middle" class="n">IP · routing</text>
    <rect y="456" width="340" height="90" fill="#f3eafa" class="box"/><text x="170" y="493" text-anchor="middle" class="t">2 · Enlace</text><text x="170" y="522" text-anchor="middle" class="n">MAC · switch · VLAN</text>
    <rect y="546" width="340" height="90" fill="#dff2f3" class="box"/><text x="170" y="583" text-anchor="middle" class="t">1 · Física</text><text x="170" y="612" text-anchor="middle" class="n">medio · señal</text>
    <rect x="410" width="340" height="246" rx="18" fill="#e3efff" class="box"/><text x="580" y="105" text-anchor="middle" class="t">Aplicación</text><text x="580" y="145" text-anchor="middle" class="n">HTTP · DNS · SMTP</text>
    <rect x="410" y="246" width="340" height="105" rx="18" fill="#e9f5ec" class="box"/><text x="580" y="290" text-anchor="middle" class="t">Transporte</text><text x="580" y="322" text-anchor="middle" class="n">TCP · UDP</text>
    <rect x="410" y="351" width="340" height="105" rx="18" fill="#fff3d6" class="box"/><text x="580" y="395" text-anchor="middle" class="t">Internet</text><text x="580" y="427" text-anchor="middle" class="n">IPv4/IPv6 · ICMP</text>
    <rect x="410" y="456" width="340" height="180" rx="18" fill="#f3eafa" class="box"/><text x="580" y="532" text-anchor="middle" class="t">Acceso a red</text><text x="580" y="568" text-anchor="middle" class="n">Ethernet · Wi-Fi</text>
    <text x="950" y="110" text-anchor="middle" class="t">DATOS</text><text x="950" y="150" text-anchor="middle" class="n">formatos y mensajes</text>
    <text x="950" y="285" text-anchor="middle" class="t">SEGMENTO / DATAGRAMA</text><text x="950" y="325" text-anchor="middle" class="n">puertos</text>
    <text x="950" y="390" text-anchor="middle" class="t">PAQUETE IP</text><text x="950" y="430" text-anchor="middle" class="n">direcciones IP</text>
    <text x="950" y="500" text-anchor="middle" class="t">TRAMA</text><text x="950" y="540" text-anchor="middle" class="n">direcciones MAC</text><text x="950" y="595" text-anchor="middle" class="t">BITS / SEÑAL</text>
  </g>
  <text x="625" y="790" text-anchor="middle" class="k">PROTOCOLO: MISMO NIVEL · INTERFAZ: CAPAS ADYACENTES · ENCAPSULACIÓN: AÑADE CABECERAS</text>
</svg>
