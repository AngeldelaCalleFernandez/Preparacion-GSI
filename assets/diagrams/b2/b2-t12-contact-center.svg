<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura funcional de un centro de contacto</title>
  <desc id="desc">Los canales entran por pasarelas y distribución, pasan por autoservicio o agentes y se integran con CRM y sistemas de backoffice, bajo servicios transversales.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.ch{fill:#dbeafe;stroke:#1d4ed8}.core{fill:#ede9fe;stroke:#7c3aed}.biz{fill:#dcfce7;stroke:#15803d}.x{fill:#fef3c7;stroke:#b45309}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="500" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Centro de contacto: una conversación, varios canales y sistemas</text>
  <path class="l" d="M230 215H300M470 215H540M720 215H790M960 215H1020"/>
  <rect class="b ch" x="40" y="105" width="190" height="220" rx="15"/><text class="t" x="135" y="141" text-anchor="middle">Canales</text><text class="s" x="135" y="176" text-anchor="middle">voz · correo</text><text class="s" x="135" y="204" text-anchor="middle">chat · web</text><text class="s" x="135" y="232" text-anchor="middle">mensajería · vídeo</text><text class="s" x="135" y="276" text-anchor="middle">entrada y salida</text>
  <rect class="b" x="300" y="130" width="170" height="170" rx="15"/><text class="t" x="385" y="170" text-anchor="middle">Acceso y reparto</text><text class="s" x="385" y="204" text-anchor="middle">gateway · SBC</text><text class="s" x="385" y="232" text-anchor="middle">ACD · colas</text><text class="s" x="385" y="260" text-anchor="middle">reglas y prioridad</text>
  <rect class="b core" x="540" y="90" width="180" height="250" rx="15"/><text class="t" x="630" y="130" text-anchor="middle">Atención</text><text class="s" x="630" y="169" text-anchor="middle">IVR y bots</text><text class="s" x="630" y="202" text-anchor="middle">agente y supervisor</text><text class="s" x="630" y="235" text-anchor="middle">CTI y escritorio</text><text class="s" x="630" y="268" text-anchor="middle">grabación</text><text class="s" x="630" y="301" text-anchor="middle">escalado</text>
  <rect class="b biz" x="790" y="130" width="170" height="170" rx="15"/><text class="t" x="875" y="170" text-anchor="middle">Contexto cliente</text><text class="s" x="875" y="204" text-anchor="middle">CRM · historial</text><text class="s" x="875" y="232" text-anchor="middle">casos y campañas</text><text class="s" x="875" y="260" text-anchor="middle">base de conocimiento</text>
  <rect class="b" x="1020" y="165" width="80" height="100" rx="15"/><text class="t" x="1060" y="205" text-anchor="middle">Back-</text><text class="t" x="1060" y="230" text-anchor="middle">office</text>
  <rect class="b x" x="145" y="385" width="830" height="70" rx="15"/><text class="t" x="560" y="413" text-anchor="middle">Servicios transversales</text><text class="s" x="560" y="439" text-anchor="middle">identidad · seguridad · consentimiento · calidad · analítica · monitorización · continuidad</text>
  <path class="l" d="M630 340V385"/><text class="s" x="560" y="478" text-anchor="middle">La omnicanalidad conserva contexto y trazabilidad cuando cambia el canal.</text>
</svg>
