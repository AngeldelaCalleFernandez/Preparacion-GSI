<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de vida del contenido digital</title>
  <desc id="desc">El contenido se captura, gestiona en un sistema documental, tramita mediante flujos, publica en un CMS, se distribuye, localiza y finalmente archiva o elimina.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.c{fill:#dbeafe;stroke:#1d4ed8}.m{fill:#ede9fe;stroke:#7c3aed}.out{fill:#dcfce7;stroke:#15803d}.end{fill:#fef3c7;stroke:#b45309}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="510" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">El contenido tiene ciclo de vida, contexto y responsabilidades</text>
  <path class="l" d="M165 165H195M325 165H355M485 165H515M645 165H675M805 165H835M965 165H1000M1060 215V285M1000 335H940M810 335H750M620 335H560M430 335H370M240 335H180M110 285V215"/>
  <rect class="b c" x="35" y="115" width="130" height="100" rx="13"/><text class="t" x="100" y="151" text-anchor="middle">Capturar</text><text class="s" x="100" y="178" text-anchor="middle">crear · digitalizar</text>
  <rect class="b" x="195" y="115" width="130" height="100" rx="13"/><text class="t" x="260" y="151" text-anchor="middle">DMS</text><text class="s" x="260" y="178" text-anchor="middle">versionar y clasificar</text>
  <rect class="b m" x="355" y="115" width="130" height="100" rx="13"/><text class="t" x="420" y="151" text-anchor="middle">Workflow</text><text class="s" x="420" y="178" text-anchor="middle">revisar y aprobar</text>
  <rect class="b m" x="515" y="115" width="130" height="100" rx="13"/><text class="t" x="580" y="151" text-anchor="middle">CMS</text><text class="s" x="580" y="178" text-anchor="middle">componer y publicar</text>
  <rect class="b out" x="675" y="115" width="130" height="100" rx="13"/><text class="t" x="740" y="151" text-anchor="middle">Distribuir</text><text class="s" x="740" y="178" text-anchor="middle">web · API · feeds</text>
  <rect class="b out" x="835" y="115" width="130" height="100" rx="13"/><text class="t" x="900" y="151" text-anchor="middle">Descubrir</text><text class="s" x="900" y="178" text-anchor="middle">SEO y buscador</text>
  <rect class="b end" x="1000" y="115" width="90" height="100" rx="13"/><text class="t" x="1045" y="151" text-anchor="middle">Usar</text><text class="s" x="1045" y="178" text-anchor="middle">medir</text>
  <rect class="b end" x="940" y="285" width="160" height="100" rx="13"/><text class="t" x="1020" y="321" text-anchor="middle">Conservar</text><text class="s" x="1020" y="348" text-anchor="middle">archivo o expurgo</text>
  <rect class="b" x="620" y="285" width="320" height="100" rx="13"/><text class="t" x="780" y="321" text-anchor="middle">Revisar vigencia</text><text class="s" x="780" y="348" text-anchor="middle">actualizar · retirar · redirigir</text>
  <rect class="b c" x="240" y="285" width="380" height="100" rx="13"/><text class="t" x="430" y="321" text-anchor="middle">Servicios que atraviesan el ciclo</text><text class="s" x="430" y="348" text-anchor="middle">metadatos · identidad · permisos · auditoría</text><text class="s" x="430" y="370" text-anchor="middle">accesibilidad · formatos · protección de datos</text>
  <rect class="b" x="20" y="285" width="160" height="100" rx="13"/><text class="t" x="100" y="321" text-anchor="middle">Gobernanza</text><text class="s" x="100" y="348" text-anchor="middle">propietario y plazos</text>
  <text class="s" x="560" y="465" text-anchor="middle">DMS gestiona documentos; CMS publica contenidos; workflow coordina tareas y decisiones.</text>
</svg>
