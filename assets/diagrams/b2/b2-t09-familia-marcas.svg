<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Familia de lenguajes de marcas</title>
  <desc id="desc">Relación entre SGML, HTML, XML, XHTML y las tecnologías XPath y XSLT asociadas a XML.</desc>
  <defs><style>.bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2}.root{fill:#dbeafe;stroke:#1d4ed8}.html{fill:#dcfce7;stroke:#15803d}.xml{fill:#fef3c7;stroke:#b45309}.bridge{fill:#ede9fe;stroke:#7c3aed}.line{stroke:#64748b;stroke-width:3;fill:none}.t{font:700 20px Arial;fill:#0f172a}.s{font:15px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="960" height="500" rx="22"/><text class="h" x="480" y="45" text-anchor="middle">De SGML a la Web y al intercambio de datos</text>
  <path class="line" d="M480 125V165M480 165H255V205M480 165H705V205"/>
  <rect class="box root" x="355" y="70" width="250" height="58" rx="12"/><text class="t" x="480" y="105" text-anchor="middle">SGML · metalenguaje</text>
  <rect class="box html" x="110" y="205" width="290" height="100" rx="14"/><text class="t" x="255" y="242" text-anchor="middle">HTML</text><text class="s" x="255" y="270" text-anchor="middle">documentos y semántica web</text><text class="s" x="255" y="292" text-anchor="middle">vocabulario predefinido</text>
  <rect class="box xml" x="560" y="205" width="290" height="100" rx="14"/><text class="t" x="705" y="242" text-anchor="middle">XML</text><text class="s" x="705" y="270" text-anchor="middle">datos estructurados extensibles</text><text class="s" x="705" y="292" text-anchor="middle">vocabularios definidos por el usuario</text>
  <path class="line" d="M400 255H560M705 305V350"/><rect class="box bridge" x="367" y="230" width="226" height="52" rx="26"/><text class="t" x="480" y="263" text-anchor="middle">XHTML · puente</text>
  <rect class="box" x="520" y="350" width="370" height="105" rx="14"/><text class="t" x="705" y="386" text-anchor="middle">Ecosistema XML</text><text class="s" x="705" y="414" text-anchor="middle">XPath selecciona nodos · XSLT transforma</text><text class="s" x="705" y="438" text-anchor="middle">esquemas validan estructura y tipos</text>
  <rect class="box" x="70" y="350" width="370" height="105" rx="14"/><text class="t" x="255" y="386" text-anchor="middle">Idea de examen</text><text class="s" x="255" y="414" text-anchor="middle">HTML presenta; XML describe e intercambia.</text><text class="s" x="255" y="438" text-anchor="middle">No son versiones sucesivas del mismo lenguaje.</text>
</svg>
