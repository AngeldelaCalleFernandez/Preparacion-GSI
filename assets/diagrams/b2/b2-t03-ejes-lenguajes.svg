<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Ejes para clasificar lenguajes</title><desc id="desc">Cinco ejes independientes: abstracción, ejecución, tipado, memoria y paradigma, con ejemplos de opciones combinables.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:34px;font-weight:800}.t{font-size:22px;font-weight:750}.n{font-size:17px}.k{font-size:14px;font-weight:800}.box{stroke:#244f78;stroke-width:3}</style>
  <rect width="1200" height="700" rx="24" fill="#f7fbff"/><text x="600" y="55" text-anchor="middle" class="h">Un lenguaje no cabe en una sola etiqueta</text>
  <g transform="translate(55 105)">
    <rect width="1090" height="92" rx="18" fill="#e3efff" class="box"/><text x="30" y="38" class="t">ABSTRACCIÓN</text><text x="260" y="38" class="n">bajo nivel</text><text x="490" y="38" class="n">alto nivel</text><text x="700" y="38" class="n">portabilidad</text><text x="900" y="38" class="n">coste oculto</text><text x="30" y="70" class="k">PREGUNTA: ¿CUÁNTO EXPONE DE LA MÁQUINA?</text>
    <rect y="108" width="1090" height="92" rx="18" fill="#e9f5ec" class="box"/><text x="30" y="146" class="t">EJECUCIÓN</text><text x="260" y="146" class="n">nativo</text><text x="420" y="146" class="n">intérprete</text><text x="600" y="146" class="n">bytecode / IL</text><text x="820" y="146" class="n">JIT / AOT</text><text x="30" y="178" class="k">UNA IMPLEMENTACIÓN PUEDE COMBINAR ESTRATEGIAS</text>
    <rect y="216" width="1090" height="92" rx="18" fill="#fff3d6" class="box"/><text x="30" y="254" class="t">TIPOS</text><text x="260" y="254" class="n">estático</text><text x="430" y="254" class="n">dinámico</text><text x="610" y="254" class="n">inferencia</text><text x="800" y="254" class="n">gradual / genéricos</text><text x="30" y="286" class="k">DINÁMICO NO SIGNIFICA SIN TIPOS</text>
    <rect y="324" width="1090" height="92" rx="18" fill="#f3eafa" class="box"/><text x="30" y="362" class="t">MEMORIA</text><text x="260" y="362" class="n">manual</text><text x="430" y="362" class="n">GC</text><text x="570" y="362" class="n">ownership / borrowing</text><text x="30" y="394" class="k">CADA MODELO CAMBIA SEGURIDAD, CONTROL Y COSTE</text>
    <rect y="432" width="1090" height="118" rx="18" fill="#dff2f3" class="box"/><text x="30" y="470" class="t">PARADIGMA</text><text x="260" y="470" class="n">imperativo</text><text x="430" y="470" class="n">OO</text><text x="540" y="470" class="n">funcional</text><text x="700" y="470" class="n">declarativo</text><text x="895" y="470" class="n">eventos</text><text x="30" y="512" class="k">MULTIPARADIGMA: LAS CATEGORÍAS NO SON EXCLUYENTES</text>
  </g><text x="600" y="675" text-anchor="middle" class="n">Clasifica por ejes; selecciona por requisitos, ecosistema, seguridad, soporte y mantenimiento.</text>
</svg>
