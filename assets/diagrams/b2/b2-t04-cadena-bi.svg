<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de valor de Business Intelligence</title><desc id="desc">Fuentes operacionales pasan por staging y ETL o ELT hacia un almacén analítico, modelo dimensional y productos de decisión, con gobierno y calidad transversales.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:34px;font-weight:800}.t{font-size:21px;font-weight:750}.n{font-size:16px}.k{font-size:14px;font-weight:800}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#2f6fb2"/></marker></defs>
  <rect width="1300" height="700" rx="24" fill="#f7fbff"/><text x="650" y="55" text-anchor="middle" class="h">BI: transformar datos en decisiones trazables</text>
  <g transform="translate(35 130)">
    <rect width="190" height="170" rx="18" fill="#e3efff" class="box"/><text x="95" y="45" text-anchor="middle" class="t">Fuentes</text><text x="95" y="82" text-anchor="middle" class="n">OLTP · ficheros</text><text x="95" y="112" text-anchor="middle" class="n">APIs · externos</text><text x="95" y="146" text-anchor="middle" class="k">OPERACIÓN</text>
    <path d="M190 85H235" class="arrow"/><rect x="245" width="190" height="170" rx="18" fill="#fff3d6" class="box"/><text x="340" y="45" text-anchor="middle" class="t">Integración</text><text x="340" y="82" text-anchor="middle" class="n">staging · ETL/ELT</text><text x="340" y="112" text-anchor="middle" class="n">limpieza · linaje</text><text x="340" y="146" text-anchor="middle" class="k">CALIDAD</text>
    <path d="M435 85H480" class="arrow"/><rect x="490" width="190" height="170" rx="18" fill="#e9f5ec" class="box"/><text x="585" y="45" text-anchor="middle" class="t">Almacén</text><text x="585" y="82" text-anchor="middle" class="n">DW · Data Mart</text><text x="585" y="112" text-anchor="middle" class="n">histórico integrado</text><text x="585" y="146" text-anchor="middle" class="k">NO VOLÁTIL</text>
    <path d="M680 85H725" class="arrow"/><rect x="735" width="190" height="170" rx="18" fill="#f3eafa" class="box"/><text x="830" y="45" text-anchor="middle" class="t">Modelo</text><text x="830" y="82" text-anchor="middle" class="n">hechos · dimensiones</text><text x="830" y="112" text-anchor="middle" class="n">OLAP · semántica</text><text x="830" y="146" text-anchor="middle" class="k">ANÁLISIS</text>
    <path d="M925 85H970" class="arrow"/><rect x="980" width="250" height="170" rx="18" fill="#dff2f3" class="box"/><text x="1105" y="45" text-anchor="middle" class="t">Decisión</text><text x="1105" y="82" text-anchor="middle" class="n">reporting · dashboard</text><text x="1105" y="112" text-anchor="middle" class="n">DSS · EIS · alertas</text><text x="1105" y="146" text-anchor="middle" class="k">KPI CON CONTEXTO</text>
  </g>
  <rect x="100" y="390" width="1100" height="105" rx="20" fill="#173a63"/><text x="650" y="430" text-anchor="middle" fill="#fff" class="t">Gobierno transversal</text><text x="650" y="468" text-anchor="middle" fill="#fff" class="n">catálogo · propietarios · metadatos · seguridad · privacidad · auditoría</text>
  <text x="650" y="570" text-anchor="middle" class="t">OLTP registra operaciones · OLAP analiza información</text><text x="650" y="610" text-anchor="middle" class="n">Separar cargas evita que las consultas analíticas degraden la operación.</text><style>text[fill="#fff"]{fill:#fff}</style>
</svg>
