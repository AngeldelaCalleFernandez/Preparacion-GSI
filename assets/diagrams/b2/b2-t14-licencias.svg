<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual de licencias y derechos sobre software</title>
  <desc id="desc">Comparación entre software propietario, licencias libres permisivas y copyleft, junto con dominio público y la distinción entre licencia y medidas DRM.</desc>
  <defs><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.p{fill:#fee2e2;stroke:#b91c1c}.free{fill:#dcfce7;stroke:#15803d}.perm{fill:#dbeafe;stroke:#1d4ed8}.copy{fill:#ede9fe;stroke:#7c3aed}.note{fill:#fef3c7;stroke:#b45309}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}.line{stroke:#64748b;stroke-width:3}</style></defs>
  <rect class="bg" width="1080" height="510" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">La licencia concede usos; no transfiere automáticamente la autoría</text>
  <line class="line" x1="540" y1="105" x2="270" y2="165"/><line class="line" x1="540" y1="105" x2="810" y2="165"/>
  <rect class="b" x="390" y="65" width="300" height="70" rx="14"/><text class="t" x="540" y="94" text-anchor="middle">Titular de derechos</text><text class="s" x="540" y="118" text-anchor="middle">decide las condiciones de explotación</text>
  <rect class="b p" x="90" y="165" width="360" height="120" rx="15"/><text class="t" x="270" y="202" text-anchor="middle">Software propietario</text><text class="s" x="270" y="230" text-anchor="middle">uso, copia y modificación limitados</text><text class="s" x="270" y="254" text-anchor="middle">por la licencia; código normalmente cerrado</text>
  <rect class="b free" x="630" y="165" width="360" height="120" rx="15"/><text class="t" x="810" y="202" text-anchor="middle">Software libre / código abierto</text><text class="s" x="810" y="230" text-anchor="middle">usar · estudiar · modificar · redistribuir</text><text class="s" x="810" y="254" text-anchor="middle">con obligaciones según la licencia</text>
  <line class="line" x1="810" y1="285" x2="675" y2="340"/><line class="line" x1="810" y1="285" x2="945" y2="340"/>
  <rect class="b perm" x="520" y="340" width="310" height="105" rx="15"/><text class="t" x="675" y="376" text-anchor="middle">Permisivas</text><text class="s" x="675" y="403" text-anchor="middle">pocas condiciones; permiten integrar</text><text class="s" x="675" y="425" text-anchor="middle">en obras con otra licencia</text>
  <rect class="b copy" x="850" y="340" width="200" height="105" rx="15"/><text class="t" x="950" y="376" text-anchor="middle">Copyleft</text><text class="s" x="950" y="403" text-anchor="middle">la redistribución mantiene</text><text class="s" x="950" y="425" text-anchor="middle">libertades y condiciones</text>
  <rect class="b note" x="30" y="340" width="440" height="105" rx="15"/><text class="t" x="250" y="374" text-anchor="middle">Dos conceptos distintos</text><text class="s" x="250" y="402" text-anchor="middle">Dominio público: no hay derechos exclusivos vigentes.</text><text class="s" x="250" y="426" text-anchor="middle">DRM: medida técnica; no es una categoría de licencia.</text>
  <text class="s" x="540" y="483" text-anchor="middle">EUPL: licencia libre de la Unión Europea con copyleft y compatibilidad expresamente regulada.</text>
</svg>
