<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo de gestión del riesgo de seguridad</title>
  <desc id="desc">Flujo desde el contexto y los activos hasta el riesgo inherente, las salvaguardas, el riesgo residual, el tratamiento y la revisión continua.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.n{fill:#dbeafe;stroke:#1d4ed8}.r{fill:#fee2e2;stroke:#b91c1c}.g{fill:#dcfce7;stroke:#15803d}.y{fill:#fef3c7;stroke:#b45309}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="520" rx="22"/><text class="h" x="560" y="44" text-anchor="middle">El riesgo se gobierna como un ciclo, no como una foto aislada</text>
  <path class="l" d="M180 135H245M395 135H460M610 135H675M825 135H890M965 185V265M890 315H825M675 315H610M460 315H395M245 315H180M105 265V185"/>
  <rect class="b n" x="30" y="85" width="150" height="100" rx="14"/><text class="t" x="105" y="123" text-anchor="middle">1. Contexto</text><text class="s" x="105" y="150" text-anchor="middle">alcance y criterios</text>
  <rect class="b" x="245" y="85" width="150" height="100" rx="14"/><text class="t" x="320" y="123" text-anchor="middle">2. Activos</text><text class="s" x="320" y="150" text-anchor="middle">valor y dependencia</text>
  <rect class="b" x="460" y="85" width="150" height="100" rx="14"/><text class="t" x="535" y="120" text-anchor="middle">3. Escenario</text><text class="s" x="535" y="147" text-anchor="middle">amenaza × vulnerabilidad</text>
  <rect class="b r" x="675" y="85" width="150" height="100" rx="14"/><text class="t" x="750" y="120" text-anchor="middle">4. Riesgo</text><text class="s" x="750" y="147" text-anchor="middle">inherente</text>
  <rect class="b g" x="890" y="85" width="150" height="100" rx="14"/><text class="t" x="965" y="120" text-anchor="middle">5. Salvaguardas</text><text class="s" x="965" y="147" text-anchor="middle">reducen probabilidad</text><text class="s" x="965" y="168" text-anchor="middle">o impacto</text>
  <rect class="b y" x="890" y="265" width="150" height="100" rx="14"/><text class="t" x="965" y="303" text-anchor="middle">6. Residual</text><text class="s" x="965" y="330" text-anchor="middle">comparar con umbral</text>
  <rect class="b" x="675" y="265" width="150" height="100" rx="14"/><text class="t" x="750" y="303" text-anchor="middle">7. Tratamiento</text><text class="s" x="750" y="330" text-anchor="middle">evitar · mitigar</text><text class="s" x="750" y="351" text-anchor="middle">transferir · aceptar</text>
  <rect class="b n" x="460" y="265" width="150" height="100" rx="14"/><text class="t" x="535" y="303" text-anchor="middle">8. Decisión</text><text class="s" x="535" y="330" text-anchor="middle">responsable y plazo</text>
  <rect class="b" x="245" y="265" width="150" height="100" rx="14"/><text class="t" x="320" y="303" text-anchor="middle">9. Seguimiento</text><text class="s" x="320" y="330" text-anchor="middle">indicadores y eficacia</text>
  <rect class="b" x="30" y="265" width="150" height="100" rx="14"/><text class="t" x="105" y="303" text-anchor="middle">10. Revisión</text><text class="s" x="105" y="330" text-anchor="middle">cambios e incidentes</text>
  <rect class="b" x="190" y="415" width="740" height="62" rx="14"/><text class="t" x="560" y="441" text-anchor="middle">Trazabilidad obligatoria</text><text class="s" x="560" y="464" text-anchor="middle">evidencia · propietario · decisión · riesgo aceptado · fecha de nueva revisión</text>
</svg>
