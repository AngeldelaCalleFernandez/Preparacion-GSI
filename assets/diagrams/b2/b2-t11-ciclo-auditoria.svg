<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
  <title id="title">Ciclo completo de una auditoría de sistemas</title>
  <desc id="desc">Secuencia desde alcance y criterios hasta planificación, trabajo de campo, evidencia, hallazgos, informe, acciones y verificación de cierre.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.p{fill:#dbeafe;stroke:#1d4ed8}.e{fill:#fef3c7;stroke:#b45309}.c{fill:#dcfce7;stroke:#15803d}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="480" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Auditar es obtener evidencia y cerrar el ciclo de mejora</text>
  <path class="l" d="M160 145H190M320 145H350M480 145H510M640 145H670M800 145H830M960 145H990M1055 195V275M990 325H925M795 325H730M600 325H535M405 325H340M210 325H145M80 275V195"/>
  <g><rect class="b p" x="30" y="95" width="130" height="100" rx="13"/><text class="t" x="95" y="132" text-anchor="middle">1. Alcance</text><text class="s" x="95" y="159" text-anchor="middle">objetivo y límites</text></g>
  <g><rect class="b" x="190" y="95" width="130" height="100" rx="13"/><text class="t" x="255" y="132" text-anchor="middle">2. Criterios</text><text class="s" x="255" y="159" text-anchor="middle">norma y controles</text></g>
  <g><rect class="b" x="350" y="95" width="130" height="100" rx="13"/><text class="t" x="415" y="132" text-anchor="middle">3. Plan</text><text class="s" x="415" y="159" text-anchor="middle">riesgo y muestreo</text></g>
  <g><rect class="b" x="510" y="95" width="130" height="100" rx="13"/><text class="t" x="575" y="132" text-anchor="middle">4. Campo</text><text class="s" x="575" y="159" text-anchor="middle">entrevista y prueba</text></g>
  <g><rect class="b e" x="670" y="95" width="130" height="100" rx="13"/><text class="t" x="735" y="132" text-anchor="middle">5. Evidencia</text><text class="s" x="735" y="159" text-anchor="middle">suficiente y fiable</text></g>
  <g><rect class="b e" x="830" y="95" width="130" height="100" rx="13"/><text class="t" x="895" y="132" text-anchor="middle">6. Hallazgo</text><text class="s" x="895" y="159" text-anchor="middle">criterio · causa</text><text class="s" x="895" y="180" text-anchor="middle">efecto · evidencia</text></g>
  <g><rect class="b" x="990" y="95" width="100" height="100" rx="13"/><text class="t" x="1040" y="132" text-anchor="middle">7. Informe</text><text class="s" x="1040" y="159" text-anchor="middle">prioriza</text></g>
  <g><rect class="b" x="795" y="275" width="130" height="100" rx="13"/><text class="t" x="860" y="312" text-anchor="middle">8. Acciones</text><text class="s" x="860" y="339" text-anchor="middle">dueño y plazo</text></g>
  <g><rect class="b c" x="535" y="275" width="195" height="100" rx="13"/><text class="t" x="632" y="312" text-anchor="middle">9. Verificación</text><text class="s" x="632" y="339" text-anchor="middle">eficacia del remedio</text></g>
  <g><rect class="b c" x="275" y="275" width="130" height="100" rx="13"/><text class="t" x="340" y="312" text-anchor="middle">10. Cierre</text><text class="s" x="340" y="339" text-anchor="middle">evidencia final</text></g>
  <rect class="b" x="30" y="275" width="180" height="100" rx="13"/><text class="t" x="120" y="312" text-anchor="middle">Seguimiento</text><text class="s" x="120" y="339" text-anchor="middle">lo pendiente vuelve</text><text class="s" x="120" y="360" text-anchor="middle">al plan de auditoría</text>
  <text class="s" x="560" y="435" text-anchor="middle">Independencia + trazabilidad + juicio profesional sostienen todas las fases.</text>
</svg>
