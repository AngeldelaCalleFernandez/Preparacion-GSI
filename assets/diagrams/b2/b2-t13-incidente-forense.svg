<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Respuesta a incidentes y análisis forense</title>
  <desc id="desc">Ciclo de preparación, detección, contención, erradicación, recuperación y aprendizaje, con una rama forense que preserva, adquiere, verifica y analiza evidencia.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.bg{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.i{fill:#fee2e2;stroke:#b91c1c}.f{fill:#dbeafe;stroke:#1d4ed8}.g{fill:#dcfce7;stroke:#15803d}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.h{font:700 27px Arial;fill:#0f172a}</style></defs>
  <rect class="bg" width="1120" height="520" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Responder restaura el servicio; la forensia conserva la evidencia</text>
  <path class="l" d="M175 140H205M335 140H365M495 140H525M655 140H685M815 140H845M975 140H1020M1080 190V225"/>
  <rect class="b" x="45" y="90" width="130" height="100" rx="13"/><text class="t" x="110" y="126" text-anchor="middle">Preparar</text><text class="s" x="110" y="153" text-anchor="middle">roles y medios</text>
  <rect class="b i" x="205" y="90" width="130" height="100" rx="13"/><text class="t" x="270" y="126" text-anchor="middle">Detectar</text><text class="s" x="270" y="153" text-anchor="middle">analizar y declarar</text>
  <rect class="b i" x="365" y="90" width="130" height="100" rx="13"/><text class="t" x="430" y="126" text-anchor="middle">Contener</text><text class="s" x="430" y="153" text-anchor="middle">limitar el daño</text>
  <rect class="b" x="525" y="90" width="130" height="100" rx="13"/><text class="t" x="590" y="126" text-anchor="middle">Erradicar</text><text class="s" x="590" y="153" text-anchor="middle">eliminar la causa</text>
  <rect class="b g" x="685" y="90" width="130" height="100" rx="13"/><text class="t" x="750" y="126" text-anchor="middle">Recuperar</text><text class="s" x="750" y="153" text-anchor="middle">validar y vigilar</text>
  <rect class="b g" x="845" y="90" width="130" height="100" rx="13"/><text class="t" x="910" y="126" text-anchor="middle">Aprender</text><text class="s" x="910" y="153" text-anchor="middle">mejorar controles</text>
  <rect class="b" x="1020" y="90" width="80" height="100" rx="13"/><text class="t" x="1060" y="125" text-anchor="middle">Volver</text><text class="s" x="1060" y="152" text-anchor="middle">a preparar</text>
  <path class="l" d="M270 190V280M385 330H420M555 330H590M725 330H760M895 330H930"/>
  <rect class="b f" x="80" y="280" width="305" height="100" rx="14"/><text class="t" x="232" y="316" text-anchor="middle">Identificar y preservar</text><text class="s" x="232" y="343" text-anchor="middle">prioridad: volatilidad e integridad</text><text class="s" x="232" y="365" text-anchor="middle">registrar quién, qué, cuándo y dónde</text>
  <rect class="b f" x="420" y="280" width="135" height="100" rx="14"/><text class="t" x="487" y="316" text-anchor="middle">Adquirir</text><text class="s" x="487" y="343" text-anchor="middle">copia forense</text>
  <rect class="b f" x="590" y="280" width="135" height="100" rx="14"/><text class="t" x="657" y="316" text-anchor="middle">Verificar</text><text class="s" x="657" y="343" text-anchor="middle">hash e integridad</text>
  <rect class="b f" x="760" y="280" width="135" height="100" rx="14"/><text class="t" x="827" y="316" text-anchor="middle">Analizar</text><text class="s" x="827" y="343" text-anchor="middle">línea temporal</text>
  <rect class="b f" x="930" y="280" width="150" height="100" rx="14"/><text class="t" x="1005" y="316" text-anchor="middle">Informar</text><text class="s" x="1005" y="343" text-anchor="middle">método y límites</text>
  <rect class="b" x="180" y="420" width="760" height="60" rx="14"/><text class="t" x="560" y="446" text-anchor="middle">Cadena de custodia transversal</text><text class="s" x="560" y="469" text-anchor="middle">identificación · sellado · transferencia · almacenamiento · acceso · disposición</text>
</svg>
