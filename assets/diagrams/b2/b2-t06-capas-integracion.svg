<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Capas lógicas y estilos de integración</title><desc id="desc">Clientes multidispositivo se conectan mediante gateway a capas de negocio y datos, con integraciones síncronas REST o SOAP y asíncronas por colas y eventos.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:33px;font-weight:800}.t{font-size:21px;font-weight:750}.n{font-size:16px}.k{font-size:14px;font-weight:800}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#2f6fb2"/></marker></defs>
  <rect width="1300" height="720" rx="24" fill="#f7fbff"/><text x="650" y="55" text-anchor="middle" class="h">Capas lógicas ≠ servidores físicos</text>
  <rect x="45" y="125" width="190" height="390" rx="20" fill="#e3efff" class="box"/><text x="140" y="165" text-anchor="middle" class="t">Clientes</text><text x="140" y="215" text-anchor="middle" class="n">web</text><text x="140" y="260" text-anchor="middle" class="n">móvil</text><text x="140" y="305" text-anchor="middle" class="n">escritorio</text><text x="140" y="350" text-anchor="middle" class="n">máquina</text><text x="140" y="410" text-anchor="middle" class="k">MULTIDISPOSITIVO</text>
  <path d="M235 320H305" class="arrow"/><rect x="315" y="125" width="210" height="390" rx="20" fill="#fff3d6" class="box"/><text x="420" y="165" text-anchor="middle" class="t">Entrada</text><text x="420" y="215" text-anchor="middle" class="n">API Gateway</text><text x="420" y="260" text-anchor="middle" class="n">autenticación</text><text x="420" y="305" text-anchor="middle" class="n">routing · límites</text><text x="420" y="350" text-anchor="middle" class="n">observabilidad</text><text x="420" y="410" text-anchor="middle" class="k">POLÍTICAS COMUNES</text>
  <path d="M525 320H595" class="arrow"/><rect x="605" y="125" width="250" height="390" rx="20" fill="#e9f5ec" class="box"/><text x="730" y="165" text-anchor="middle" class="t">Aplicación / dominio</text><text x="730" y="215" text-anchor="middle" class="n">casos de uso</text><text x="730" y="260" text-anchor="middle" class="n">reglas de negocio</text><text x="730" y="305" text-anchor="middle" class="n">servicios / SOA</text><text x="730" y="350" text-anchor="middle" class="n">contratos</text><text x="730" y="410" text-anchor="middle" class="k">COHESIÓN Y AUTONOMÍA</text>
  <path d="M855 250H925" class="arrow"/><rect x="935" y="125" width="320" height="230" rx="20" fill="#f3eafa" class="box"/><text x="1095" y="165" text-anchor="middle" class="t">Persistencia</text><text x="1095" y="215" text-anchor="middle" class="n">SGBD · objetos · caché</text><text x="1095" y="260" text-anchor="middle" class="n">repositorios y transacciones</text><text x="1095" y="315" text-anchor="middle" class="k">ESTADO Y CONSISTENCIA</text>
  <path d="M855 425H925" class="arrow"/><rect x="935" y="385" width="320" height="130" rx="20" fill="#dff2f3" class="box"/><text x="1095" y="428" text-anchor="middle" class="t">Colas / eventos</text><text x="1095" y="464" text-anchor="middle" class="n">desacoplamiento temporal</text><text x="1095" y="495" text-anchor="middle" class="n">reintentos · duplicados · DLQ</text>
  <rect x="190" y="570" width="420" height="80" rx="18" fill="#173a63"/><text x="400" y="604" text-anchor="middle" fill="#fff" class="t">Síncrono: REST / SOAP</text><text x="400" y="633" text-anchor="middle" fill="#fff" class="n">dependencia temporal y respuesta directa</text>
  <rect x="690" y="570" width="420" height="80" rx="18" fill="#5a3a70"/><text x="900" y="604" text-anchor="middle" fill="#fff" class="t">Asíncrono: mensajes / eventos</text><text x="900" y="633" text-anchor="middle" fill="#fff" class="n">absorbe picos; exige idempotencia</text><style>text[fill="#fff"]{fill:#fff}</style>
</svg>
