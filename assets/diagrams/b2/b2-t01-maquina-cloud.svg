<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">De la máquina física al servicio cloud</title>
  <desc id="desc">Capas de hardware, virtualización y cloud, seguidas por una comparación de responsabilidades en IaaS, PaaS y SaaS.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:34px;font-weight:800}.t{font-size:23px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:800}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#2f6fb2"/></marker></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fbff"/><text x="600" y="54" text-anchor="middle" class="h">De los recursos físicos al servicio consumido</text>
  <rect x="55" y="115" width="240" height="130" rx="18" fill="#e3efff" class="box"/><text x="175" y="158" text-anchor="middle" class="t">Hardware</text><text x="175" y="195" text-anchor="middle" class="n">CPU · RAM · E/S</text><text x="175" y="222" text-anchor="middle" class="n">almacenamiento · red</text>
  <path d="M295 180H345" class="arrow"/><rect x="355" y="115" width="240" height="130" rx="18" fill="#e9f5ec" class="box"/><text x="475" y="158" text-anchor="middle" class="t">Virtualización</text><text x="475" y="195" text-anchor="middle" class="n">hipervisor · máquinas</text><text x="475" y="222" text-anchor="middle" class="n">recursos lógicos</text>
  <path d="M595 180H645" class="arrow"/><rect x="655" y="115" width="240" height="130" rx="18" fill="#fff3d6" class="box"/><text x="775" y="158" text-anchor="middle" class="t">Cloud</text><text x="775" y="195" text-anchor="middle" class="n">autoservicio · medición</text><text x="775" y="222" text-anchor="middle" class="n">elasticidad · red</text>
  <path d="M895 180H945" class="arrow"/><rect x="955" y="115" width="190" height="130" rx="18" fill="#f3eafa" class="box"/><text x="1050" y="158" text-anchor="middle" class="t">Servicio</text><text x="1050" y="195" text-anchor="middle" class="n">capacidad entregada</text><text x="1050" y="222" text-anchor="middle" class="n">con un SLA</text>
  <text x="65" y="320" class="t">Quién gestiona qué</text>
  <rect x="70" y="355" width="325" height="220" rx="18" fill="#e3efff" class="box"/><text x="232" y="395" text-anchor="middle" class="t">IaaS</text><text x="105" y="440" class="n">Proveedor: hardware y virtualización</text><text x="105" y="476" class="n">Cliente: SO, plataforma, aplicación</text><text x="105" y="525" class="k">MÁS CONTROL DEL CLIENTE</text>
  <rect x="438" y="355" width="325" height="220" rx="18" fill="#e9f5ec" class="box"/><text x="600" y="395" text-anchor="middle" class="t">PaaS</text><text x="473" y="440" class="n">Proveedor: infraestructura + runtime</text><text x="473" y="476" class="n">Cliente: aplicación y datos</text><text x="473" y="525" class="k">FOCO EN DESARROLLO</text>
  <rect x="805" y="355" width="325" height="220" rx="18" fill="#f3eafa" class="box"/><text x="967" y="395" text-anchor="middle" class="t">SaaS</text><text x="840" y="440" class="n">Proveedor: aplicación completa</text><text x="840" y="476" class="n">Cliente: uso, datos y configuración</text><text x="840" y="525" class="k">MÁS GESTIÓN DEL PROVEEDOR</text>
  <text x="600" y="642" text-anchor="middle" class="n">Escalabilidad permite crecer; elasticidad ajusta recursos a la demanda. No son sinónimos.</text>
</svg>
