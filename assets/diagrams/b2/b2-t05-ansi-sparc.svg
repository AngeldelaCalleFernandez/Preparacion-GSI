<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura ANSI SPARC e independencia de datos</title><desc id="desc">Tres niveles, externo, conceptual e interno, conectados por independencia lógica y física con ejemplos de qué cambia en cada nivel.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:34px;font-weight:800}.t{font-size:24px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:800}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#2f6fb2"/></marker></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fbff"/><text x="600" y="55" text-anchor="middle" class="h">ANSI/X3/SPARC: tres niveles, dos independencias</text>
  <rect x="210" y="100" width="780" height="120" rx="20" fill="#e3efff" class="box"/><text x="600" y="145" text-anchor="middle" class="t">NIVEL EXTERNO</text><text x="600" y="182" text-anchor="middle" class="n">vistas adaptadas a usuarios y aplicaciones</text>
  <path d="M600 220V280" class="arrow"/><rect x="755" y="232" width="350" height="48" rx="24" fill="#fff3d6" class="box"/><text x="930" y="263" text-anchor="middle" class="k">INDEPENDENCIA LÓGICA</text>
  <rect x="210" y="290" width="780" height="120" rx="20" fill="#e9f5ec" class="box"/><text x="600" y="335" text-anchor="middle" class="t">NIVEL CONCEPTUAL</text><text x="600" y="372" text-anchor="middle" class="n">modelo lógico global, relaciones y restricciones</text>
  <path d="M600 410V470" class="arrow"/><rect x="755" y="422" width="350" height="48" rx="24" fill="#f3eafa" class="box"/><text x="930" y="453" text-anchor="middle" class="k">INDEPENDENCIA FÍSICA</text>
  <rect x="210" y="480" width="780" height="120" rx="20" fill="#dff2f3" class="box"/><text x="600" y="525" text-anchor="middle" class="t">NIVEL INTERNO</text><text x="600" y="562" text-anchor="middle" class="n">ficheros, páginas, índices y organización física</text>
  <text x="600" y="655" text-anchor="middle" class="n">La independencia lógica suele ser más difícil: cambia el modelo que consumen las vistas.</text>
</svg>
