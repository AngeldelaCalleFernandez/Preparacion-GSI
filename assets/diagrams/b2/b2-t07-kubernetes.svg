<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura conceptual de Kubernetes</title><desc id="desc">Control plane con API Server, scheduler, controller manager y almacén de estado; nodos con kubelet, runtime y pods; Services y entrada estable frente a pods reemplazables.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172b42}.h{font-size:34px;font-weight:800}.t{font-size:21px;font-weight:750}.n{font-size:16px}.k{font-size:14px;font-weight:800}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:4;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 0 6 9 3z" fill="#2f6fb2"/></marker></defs>
  <rect width="1300" height="720" rx="24" fill="#f7fbff"/><text x="650" y="55" text-anchor="middle" class="h">Kubernetes reconcilia estado deseado y estado real</text>
  <rect x="55" y="105" width="1190" height="190" rx="22" fill="#e3efff" class="box"/><text x="650" y="145" text-anchor="middle" class="t">CONTROL PLANE</text>
  <rect x="90" y="175" width="245" height="80" rx="14" fill="#fff" class="box"/><text x="212" y="208" text-anchor="middle" class="t">API Server</text><text x="212" y="237" text-anchor="middle" class="n">entrada y validación</text>
  <rect x="375" y="175" width="245" height="80" rx="14" fill="#fff" class="box"/><text x="497" y="208" text-anchor="middle" class="t">Scheduler</text><text x="497" y="237" text-anchor="middle" class="n">elige nodo</text>
  <rect x="660" y="175" width="245" height="80" rx="14" fill="#fff" class="box"/><text x="782" y="208" text-anchor="middle" class="t">Controllers</text><text x="782" y="237" text-anchor="middle" class="n">reconcilian objetos</text>
  <rect x="945" y="175" width="245" height="80" rx="14" fill="#fff" class="box"/><text x="1067" y="208" text-anchor="middle" class="t">Estado</text><text x="1067" y="237" text-anchor="middle" class="n">configuración del clúster</text>
  <path d="M650 295V350" class="arrow"/>
  <rect x="55" y="360" width="520" height="245" rx="22" fill="#e9f5ec" class="box"/><text x="315" y="402" text-anchor="middle" class="t">NODO A</text><text x="315" y="435" text-anchor="middle" class="n">kubelet · runtime · red</text>
  <rect x="95" y="470" width="200" height="90" rx="16" fill="#fff" class="box"/><text x="195" y="505" text-anchor="middle" class="t">Pod</text><text x="195" y="535" text-anchor="middle" class="n">contenedor(es)</text>
  <rect x="335" y="470" width="200" height="90" rx="16" fill="#fff" class="box"/><text x="435" y="505" text-anchor="middle" class="t">Pod</text><text x="435" y="535" text-anchor="middle" class="n">reemplazable</text>
  <rect x="625" y="360" width="520" height="245" rx="22" fill="#f3eafa" class="box"/><text x="885" y="402" text-anchor="middle" class="t">NODO B</text><text x="885" y="435" text-anchor="middle" class="n">kubelet · runtime · red</text>
  <rect x="665" y="470" width="200" height="90" rx="16" fill="#fff" class="box"/><text x="765" y="505" text-anchor="middle" class="t">Pod</text><text x="765" y="535" text-anchor="middle" class="n">contenedor(es)</text>
  <rect x="905" y="470" width="200" height="90" rx="16" fill="#fff" class="box"/><text x="1005" y="505" text-anchor="middle" class="t">Pod</text><text x="1005" y="535" text-anchor="middle" class="n">reemplazable</text>
  <rect x="350" y="630" width="600" height="55" rx="27" fill="#173a63"/><text x="650" y="664" text-anchor="middle" fill="#fff" class="k">SERVICE: IDENTIDAD Y ACCESO ESTABLE A PODS SELECCIONADOS</text><style>text[fill="#fff"]{fill:#fff}</style>
</svg>
