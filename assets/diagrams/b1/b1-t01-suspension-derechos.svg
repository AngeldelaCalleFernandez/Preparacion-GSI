<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Suspensión general e individual de derechos</title>
  <desc id="desc">Dos columnas comparan los supuestos, derechos y controles de los apartados uno y dos del artículo 55 de la Constitución.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.sh{font-size:25px;font-weight:750}.n{font-size:19px}.k{font-size:18px;font-weight:700}.box{stroke-width:3}.line{stroke:#7b8fa5;stroke-width:3;stroke-dasharray:9 8}</style>
  <rect width="1200" height="650" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Artículo 55 CE · no memorices una sola lista</text>
  <line x1="600" y1="105" x2="600" y2="585" class="line"/>
  <rect x="55" y="105" width="500" height="480" rx="20" fill="#fff2dd" stroke="#8b5a12" class="box"/>
  <text x="305" y="158" text-anchor="middle" class="sh">55.1 · suspensión general</text>
  <text x="90" y="210" class="k">SUPUESTO</text><text x="90" y="242" class="n">Estado de excepción o de sitio</text>
  <text x="90" y="295" class="k">DERECHOS</text><text x="90" y="330" class="n">17 · 18.2 y 18.3 · 19</text><text x="90" y="365" class="n">20.1 a/d y 20.5 · 21 · 28.2 · 37.2</text>
  <rect x="90" y="405" width="430" height="105" rx="14" fill="#fff" stroke="#8b5a12" stroke-width="2"/>
  <text x="110" y="440" class="k">TRAMPA DE EXAMEN</text><text x="110" y="475" class="n">En excepción se exceptúa el art. 17.3;</text><text x="110" y="503" class="n">esa salvedad no se formula para sitio.</text>
  <rect x="645" y="105" width="500" height="480" rx="20" fill="#e5f1ff" stroke="#245c91" class="box"/>
  <text x="895" y="158" text-anchor="middle" class="sh">55.2 · suspensión individual</text>
  <text x="680" y="210" class="k">SUPUESTO</text><text x="680" y="242" class="n">Persona determinada; investigación ligada</text><text x="680" y="270" class="n">a bandas armadas o terrorismo</text>
  <text x="680" y="323" class="k">DERECHOS</text><text x="680" y="358" class="n">17.2 · 18.2 · 18.3</text>
  <text x="680" y="411" class="k">GARANTÍAS</text><text x="680" y="446" class="n">Ley orgánica + intervención judicial</text><text x="680" y="474" class="n">+ control parlamentario</text>
  <rect x="755" y="525" width="280" height="42" rx="21" fill="#173a63"/><text x="895" y="553" text-anchor="middle" fill="#fff" class="k">LISTAS DIFERENTES</text>
  <text x="600" y="625" text-anchor="middle" class="n">General = situación excepcional colectiva · Individual = investigación y persona concreta</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
