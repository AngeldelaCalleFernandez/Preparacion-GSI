<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa normativo de igualdad, discapacidad y dependencia</title>
  <desc id="desc">Seis tarjetas vinculan cada materia con su norma y tres comparaciones inferiores separan conceptos próximos.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:22px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}</style>
  <rect width="1200" height="760" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Materia → norma → concepto que no debes mezclar</text>
  <g>
    <rect x="55" y="105" width="340" height="125" rx="18" fill="#e3efff" class="box"/><text x="225" y="145" text-anchor="middle" class="b">Igualdad mujeres/hombres</text><text x="225" y="180" text-anchor="middle" class="n">LO 3/2007</text><text x="225" y="208" text-anchor="middle" class="k">TRATO Y OPORTUNIDADES</text>
    <rect x="430" y="105" width="340" height="125" rx="18" fill="#fff1e6" class="box"/><text x="600" y="145" text-anchor="middle" class="b">Violencia de género</text><text x="600" y="180" text-anchor="middle" class="n">LO 1/2004</text><text x="600" y="208" text-anchor="middle" class="k">PROTECCIÓN INTEGRAL</text>
    <rect x="805" y="105" width="340" height="125" rx="18" fill="#e9f5ec" class="box"/><text x="975" y="145" text-anchor="middle" class="b">No discriminación</text><text x="975" y="180" text-anchor="middle" class="n">Ley 15/2022</text><text x="975" y="208" text-anchor="middle" class="k">GARANTÍAS TRANSVERSALES</text>
    <rect x="55" y="265" width="340" height="125" rx="18" fill="#f3eafa" class="box"/><text x="225" y="305" text-anchor="middle" class="b">Personas trans y LGTBI</text><text x="225" y="340" text-anchor="middle" class="n">Ley 4/2023</text><text x="225" y="368" text-anchor="middle" class="k">IGUALDAD REAL Y DERECHOS</text>
    <rect x="430" y="265" width="340" height="125" rx="18" fill="#e8f4f7" class="box"/><text x="600" y="305" text-anchor="middle" class="b">Discapacidad</text><text x="600" y="340" text-anchor="middle" class="n">RDL 1/2013</text><text x="600" y="368" text-anchor="middle" class="k">ACCESIBILIDAD E INCLUSIÓN</text>
    <rect x="805" y="265" width="340" height="125" rx="18" fill="#fff3d6" class="box"/><text x="975" y="305" text-anchor="middle" class="b">Dependencia</text><text x="975" y="340" text-anchor="middle" class="n">Ley 39/2006</text><text x="975" y="368" text-anchor="middle" class="k">AUTONOMÍA Y ATENCIÓN</text>
  </g>
  <text x="60" y="455" class="b">Tres oposiciones conceptuales de examen</text>
  <rect x="55" y="495" width="340" height="185" rx="18" fill="#fff" class="box"/><text x="225" y="535" text-anchor="middle" class="b">Directa ≠ indirecta</text><text x="225" y="575" text-anchor="middle" class="n">trato menos favorable</text><text x="225" y="605" text-anchor="middle" class="k">FRENTE A</text><text x="225" y="635" text-anchor="middle" class="n">criterio neutro con desventaja</text>
  <rect x="430" y="495" width="340" height="185" rx="18" fill="#fff" class="box"/><text x="600" y="535" text-anchor="middle" class="b">Diseño universal ≠ ajuste</text><text x="600" y="575" text-anchor="middle" class="n">concebir para todas las personas</text><text x="600" y="605" text-anchor="middle" class="k">FRENTE A</text><text x="600" y="635" text-anchor="middle" class="n">adaptación necesaria y adecuada</text>
  <rect x="805" y="495" width="340" height="185" rx="18" fill="#fff" class="box"/><text x="975" y="535" text-anchor="middle" class="b">Discapacidad ≠ dependencia</text><text x="975" y="575" text-anchor="middle" class="n">interacción y barreras</text><text x="975" y="605" text-anchor="middle" class="k">FRENTE A</text><text x="975" y="635" text-anchor="middle" class="n">necesidad permanente de apoyo</text>
  <text x="600" y="725" text-anchor="middle" class="n">La norma aplicable depende del supuesto; las categorías pueden coexistir sin convertirse en sinónimos.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
