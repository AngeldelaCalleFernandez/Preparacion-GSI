<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">De eIDAS 1 al Marco Europeo de Identidad Digital</title>
  <desc id="desc">Secuencia vertical: Reglamento 910/2014, Reglamento 2024/1183 que lo modifica y amplía, Marco Europeo de Identidad Digital y EUDI Wallet como medio de identificación electrónica bajo control del usuario.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}
    .h{font-size:34px;font-weight:780}.t{font-size:25px;font-weight:760}.n{font-size:18px}.k{font-size:15px;font-weight:800;letter-spacing:.04em}
    .box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4z" fill="#2f6fb2"/></marker></defs>
  <rect width="1200" height="820" rx="24" fill="#f7fbff"/>
  <text x="600" y="58" text-anchor="middle" class="h">eIDAS 1 → eIDAS 2: evolución, no sustitución total</text>

  <rect x="210" y="95" width="780" height="125" rx="20" fill="#e3efff" class="box"/>
  <text x="600" y="137" text-anchor="middle" class="k">PUNTO DE PARTIDA</text>
  <text x="600" y="174" text-anchor="middle" class="t">Reglamento (UE) n.º 910/2014 · eIDAS</text>
  <text x="600" y="205" text-anchor="middle" class="n">Identificación electrónica y servicios de confianza</text>

  <path d="M600 220 V276" class="arrow"/>
  <rect x="210" y="285" width="780" height="145" rx="20" fill="#fff3d6" class="box"/>
  <text x="600" y="327" text-anchor="middle" class="k">REFORMA</text>
  <text x="600" y="365" text-anchor="middle" class="t">Reglamento (UE) 2024/1183</text>
  <text x="600" y="398" text-anchor="middle" class="n">MODIFICA Y AMPLÍA el Reglamento 910/2014</text>
  <rect x="815" y="310" width="135" height="42" rx="21" fill="#8a5b00"/>
  <text x="882" y="337" text-anchor="middle" fill="#fff" class="k">NO LO REEMPLAZA</text>

  <path d="M600 430 V486" class="arrow"/>
  <rect x="210" y="495" width="780" height="115" rx="20" fill="#e9f5ec" class="box"/>
  <text x="600" y="540" text-anchor="middle" class="k">RESULTADO JURÍDICO</text>
  <text x="600" y="578" text-anchor="middle" class="t">Marco Europeo de Identidad Digital</text>

  <path d="M600 610 V666" class="arrow"/>
  <rect x="210" y="675" width="780" height="100" rx="20" fill="#f3eafa" class="box"/>
  <text x="600" y="715" text-anchor="middle" class="t">Cartera Europea de Identidad Digital · EUDI Wallet</text>
  <text x="600" y="750" text-anchor="middle" class="n">Identidad + atributos + autenticación + firma cualificada, bajo control del usuario</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
