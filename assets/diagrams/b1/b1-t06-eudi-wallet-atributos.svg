<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">EUDI Wallet, atributos y divulgación selectiva</title>
  <desc id="desc">Flujo conceptual desde una fuente auténtica que contiene un dato, pasando por una declaración electrónica de atributos y la cartera, hasta la decisión del usuario y la verificación por una Administración, empresa o servicio. El ejemplo revela solo Mayor de 18: sí y no la fecha de nacimiento ni el domicilio.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}
    .h{font-size:32px;font-weight:780}.t{font-size:22px;font-weight:760}.n{font-size:17px}.s{font-size:15px}.k{font-size:14px;font-weight:800;letter-spacing:.04em}
    .box{stroke:#244f78;stroke-width:3}.arrow{stroke:#2f6fb2;stroke-width:5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0 L0 8 L11 4z" fill="#2f6fb2"/></marker></defs>
  <rect width="1400" height="800" rx="24" fill="#f7fbff"/>
  <text x="700" y="56" text-anchor="middle" class="h">De la fuente al servicio: el usuario controla la presentación</text>

  <g>
    <rect x="45" y="130" width="235" height="180" rx="20" fill="#e3efff" class="box"/>
    <ellipse cx="162" cy="172" rx="62" ry="22" fill="#b9d6f4" stroke="#244f78" stroke-width="3"/>
    <path d="M100 172 V218 C100 230 128 240 162 240 C196 240 224 230 224 218 V172" fill="#b9d6f4" stroke="#244f78" stroke-width="3"/>
    <text x="162" y="272" text-anchor="middle" class="t">Fuente auténtica</text>
    <text x="162" y="298" text-anchor="middle" class="s">dato oficial o reconocido</text>

    <path d="M280 220 H330" class="arrow"/>
    <rect x="340" y="130" width="265" height="180" rx="20" fill="#e9f5ec" class="box"/>
    <text x="472" y="174" text-anchor="middle" class="k">ATRIBUTO</text>
    <text x="472" y="211" text-anchor="middle" class="t">Mayoría de edad</text>
    <text x="472" y="247" text-anchor="middle" class="n">Declaración electrónica</text>
    <text x="472" y="276" text-anchor="middle" class="n">que permite autenticarlo</text>

    <path d="M605 220 H655" class="arrow"/>
    <rect x="665" y="105" width="285" height="230" rx="32" fill="#f3eafa" class="box"/>
    <rect x="740" y="130" width="135" height="155" rx="22" fill="#fff" stroke="#5a3a70" stroke-width="4"/>
    <circle cx="807" cy="260" r="8" fill="#5a3a70"/>
    <text x="807" y="174" text-anchor="middle" class="k">EUDI</text>
    <text x="807" y="201" text-anchor="middle" class="t">Wallet</text>
    <text x="807" y="316" text-anchor="middle" class="n">almacena y gestiona</text>

    <path d="M950 220 H1000" class="arrow"/>
    <rect x="1010" y="130" width="345" height="180" rx="20" fill="#fff3d6" class="box"/>
    <text x="1182" y="174" text-anchor="middle" class="k">DECISIÓN DEL USUARIO</text>
    <text x="1182" y="212" text-anchor="middle" class="t">¿Qué presento?</text>
    <text x="1182" y="251" text-anchor="middle" class="n">selecciona el dato necesario</text>
    <text x="1182" y="280" text-anchor="middle" class="n">para esta interacción</text>
  </g>

  <path d="M1182 310 V386 H700 V435" class="arrow"/>
  <rect x="420" y="445" width="560" height="205" rx="22" fill="#ffffff" class="box"/>
  <text x="700" y="485" text-anchor="middle" class="k">ADMINISTRACIÓN · EMPRESA · SERVICIO</text>
  <text x="700" y="527" text-anchor="middle" class="t">Verifica lo presentado</text>
  <rect x="500" y="552" width="400" height="60" rx="30" fill="#21643d"/>
  <text x="700" y="590" text-anchor="middle" fill="#fff" class="t">MAYOR DE 18: SÍ</text>

  <rect x="75" y="455" width="290" height="175" rx="20" fill="#fcecec" stroke="#9b3636" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="220" y="497" text-anchor="middle" class="k">NO ES NECESARIO REVELAR</text>
  <text x="220" y="538" text-anchor="middle" class="n">Fecha completa de nacimiento</text>
  <text x="220" y="574" text-anchor="middle" class="n">Domicilio</text>
  <text x="220" y="610" text-anchor="middle" class="n">Otros datos personales</text>

  <rect x="1035" y="455" width="290" height="175" rx="20" fill="#e9f5ec" class="box"/>
  <text x="1180" y="497" text-anchor="middle" class="k">PRINCIPIOS</text>
  <text x="1180" y="538" text-anchor="middle" class="n">Control del usuario</text>
  <text x="1180" y="574" text-anchor="middle" class="n">Minimización de datos</text>
  <text x="1180" y="610" text-anchor="middle" class="n">Divulgación selectiva</text>

  <text x="700" y="714" text-anchor="middle" class="n">Ejemplo conceptual: no impone un único flujo técnico ni sustituye la verificación de autenticidad y validez.</text>
  <rect x="432" y="744" width="536" height="38" rx="19" fill="#173a63"/>
  <text x="700" y="769" text-anchor="middle" fill="#fff" class="k">LA WALLET ES EL MEDIO; EL ATRIBUTO ES EL DATO ACREDITADO</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
