<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Actores y responsabilidades en protección de datos</title>
  <desc id="desc">El responsable ocupa el centro y se relaciona con interesado, encargado, corresponsable, delegado de protección de datos y autoridad de control.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:22px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.link{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">RGPD · función antes que etiqueta</text>
  <rect x="430" y="245" width="340" height="190" rx="24" fill="#e3efff" class="box"/><text x="600" y="292" text-anchor="middle" class="b">Responsable</text><text x="600" y="330" text-anchor="middle" class="n">determina fines y medios</text><text x="600" y="360" text-anchor="middle" class="n">aplica y demuestra cumplimiento</text><rect x="485" y="385" width="230" height="34" rx="17" fill="#173a63"/><text x="600" y="408" text-anchor="middle" fill="#fff" class="k">RESPONSABILIDAD PROACTIVA</text>
  <rect x="65" y="120" width="285" height="145" rx="18" fill="#e9f5ec" class="box"/><text x="208" y="162" text-anchor="middle" class="b">Interesado</text><text x="208" y="198" text-anchor="middle" class="n">persona a quien</text><text x="208" y="226" text-anchor="middle" class="n">se refieren los datos</text><path d="M350 220 C420 230 430 270 470 290" class="link"/>
  <rect x="65" y="470" width="285" height="145" rx="18" fill="#fff3d6" class="box"/><text x="208" y="512" text-anchor="middle" class="b">Encargado</text><text x="208" y="548" text-anchor="middle" class="n">trata datos por cuenta</text><text x="208" y="576" text-anchor="middle" class="n">del responsable</text><path d="M350 525 C420 500 440 430 485 410" class="link"/>
  <rect x="850" y="120" width="285" height="145" rx="18" fill="#f3eafa" class="box"/><text x="992" y="162" text-anchor="middle" class="b">Corresponsable</text><text x="992" y="198" text-anchor="middle" class="n">decide conjuntamente</text><text x="992" y="226" text-anchor="middle" class="n">fines y medios</text><path d="M850 220 C790 230 770 270 735 295" class="link"/>
  <rect x="850" y="470" width="285" height="145" rx="18" fill="#e8f4f7" class="box"/><text x="992" y="512" text-anchor="middle" class="b">Autoridad de control</text><text x="992" y="548" text-anchor="middle" class="n">supervisa · investiga</text><text x="992" y="576" text-anchor="middle" class="n">corrige / sanciona</text><path d="M850 525 C790 500 770 440 730 415" class="link"/>
  <rect x="455" y="510" width="290" height="140" rx="18" fill="#fff" class="box"/><text x="600" y="550" text-anchor="middle" class="b">DPD / DPO</text><text x="600" y="585" text-anchor="middle" class="n">informa · asesora · supervisa</text><text x="600" y="615" text-anchor="middle" class="k">INDEPENDENCIA; NO AUTORIZA TODO</text><path d="M600 510 V440" class="link"/>
  <rect x="455" y="105" width="290" height="88" rx="18" fill="#173a63"/><text x="600" y="142" text-anchor="middle" fill="#fff" class="b">Privacidad por diseño</text><text x="600" y="170" text-anchor="middle" fill="#fff" class="n">y por defecto</text><path d="M600 193 V240" class="link"/>
  <text x="600" y="690" text-anchor="middle" class="n">El contrato de encargo concreta instrucciones; no convierte al encargado en responsable del tratamiento.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
