<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Transparencia: publicidad activa, acceso y buen gobierno</title>
  <desc id="desc">Tres columnas explican las piezas de la Ley 19/2013 y un flujo inferior resume el procedimiento de acceso.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:24px;font-weight:750}.n{font-size:18px}.k{font-size:16px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Ley 19/2013 · tres sistemas que no se sustituyen</text>
  <rect x="55" y="110" width="340" height="210" rx="20" fill="#e3efff" class="box"/><text x="225" y="155" text-anchor="middle" class="b">Publicidad activa</text><text x="225" y="195" text-anchor="middle" class="n">La entidad publica</text><text x="225" y="225" text-anchor="middle" class="n">sin petición previa</text><rect x="110" y="255" width="230" height="40" rx="20" fill="#173a63"/><text x="225" y="281" text-anchor="middle" fill="#fff" class="k">PERIÓDICA Y ACTUALIZADA</text>
  <rect x="430" y="110" width="340" height="210" rx="20" fill="#e9f5ec" class="box"/><text x="600" y="155" text-anchor="middle" class="b">Derecho de acceso</text><text x="600" y="195" text-anchor="middle" class="n">Una persona solicita</text><text x="600" y="225" text-anchor="middle" class="n">información pública</text><rect x="485" y="255" width="230" height="40" rx="20" fill="#235d3a"/><text x="600" y="281" text-anchor="middle" fill="#fff" class="k">NO EXIGE MOTIVACIÓN</text>
  <rect x="805" y="110" width="340" height="210" rx="20" fill="#f3eafa" class="box"/><text x="975" y="155" text-anchor="middle" class="b">Buen gobierno</text><text x="975" y="195" text-anchor="middle" class="n">Principios y responsabilidades</text><text x="975" y="225" text-anchor="middle" class="n">de responsables públicos</text><rect x="860" y="255" width="230" height="40" rx="20" fill="#5a3a70"/><text x="975" y="281" text-anchor="middle" fill="#fff" class="k">RENDICIÓN DE CUENTAS</text>
  <text x="60" y="385" class="b">Acceso: secuencia mínima</text>
  <rect x="55" y="430" width="190" height="90" rx="16" fill="#fff" class="box"/><text x="150" y="468" text-anchor="middle" class="b">Solicitud</text><text x="150" y="497" text-anchor="middle" class="n">órgano que posee</text>
  <path d="M245 475 H320" class="arrow"/><rect x="325" y="415" width="235" height="120" rx="16" fill="#fff3d6" class="box"/><text x="442" y="452" text-anchor="middle" class="b">Examen</text><text x="442" y="482" text-anchor="middle" class="n">¿inadmisión?</text><text x="442" y="510" text-anchor="middle" class="n">¿límites? ¿datos?</text>
  <path d="M560 475 H635" class="arrow"/><rect x="640" y="415" width="235" height="120" rx="16" fill="#fff" class="box"/><text x="757" y="452" text-anchor="middle" class="b">Resolución</text><text x="757" y="482" text-anchor="middle" class="n">1 mes + posible</text><text x="757" y="510" text-anchor="middle" class="n">ampliación de 1 mes</text>
  <path d="M875 475 H950" class="arrow"/><rect x="955" y="430" width="190" height="90" rx="16" fill="#fff" class="box"/><text x="1050" y="468" text-anchor="middle" class="b">Reclamación</text><text x="1050" y="497" text-anchor="middle" class="n">CTBG / vía aplicable</text>
  <path d="M757 535 V605 H560" class="arrow"/><rect x="330" y="570" width="230" height="85" rx="16" fill="#e3efff" class="box"/><text x="445" y="605" text-anchor="middle" class="b">Acceso parcial</text><text x="445" y="635" text-anchor="middle" class="n">si el límite afecta solo a parte</text>
  <rect x="665" y="580" width="450" height="60" rx="15" fill="#173a63"/><text x="890" y="618" text-anchor="middle" fill="#fff" class="k">SILENCIO: DESESTIMATORIO · LÍMITE ≠ INADMISIÓN</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
