<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Procedimiento electrónico de extremo a extremo</title>
  <desc id="desc">Cadena desde interesado y registro hasta archivo con cuatro capas transversales: ENS, ENI, protección de datos y accesibilidad.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:20px;font-weight:750}.n{font-size:16px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Expediente electrónico · una cadena de evidencias</text>
  <g>
    <rect x="45" y="145" width="150" height="110" rx="17" fill="#e3efff" class="box"/><text x="120" y="186" text-anchor="middle" class="b">Interesado</text><text x="120" y="220" text-anchor="middle" class="n">o representante</text>
    <path d="M195 200 H225" class="arrow"/><rect x="230" y="145" width="150" height="110" rx="17" fill="#e9f5ec" class="box"/><text x="305" y="186" text-anchor="middle" class="b">Registro</text><text x="305" y="220" text-anchor="middle" class="n">asiento + recibo</text>
    <path d="M380 200 H410" class="arrow"/><rect x="415" y="145" width="150" height="110" rx="17" fill="#fff3d6" class="box"/><text x="490" y="186" text-anchor="middle" class="b">Expediente</text><text x="490" y="220" text-anchor="middle" class="n">índice + metadatos</text>
    <path d="M565 200 H595" class="arrow"/><rect x="600" y="145" width="150" height="110" rx="17" fill="#fff" class="box"/><text x="675" y="186" text-anchor="middle" class="b">Instrucción</text><text x="675" y="220" text-anchor="middle" class="n">actuaciones</text>
    <path d="M750 200 H780" class="arrow"/><rect x="785" y="145" width="150" height="110" rx="17" fill="#f3eafa" class="box"/><text x="860" y="186" text-anchor="middle" class="b">Resolución</text><text x="860" y="220" text-anchor="middle" class="n">firma / sello</text>
    <path d="M935 200 H965" class="arrow"/><rect x="970" y="145" width="185" height="110" rx="17" fill="#e8f4f7" class="box"/><text x="1062" y="186" text-anchor="middle" class="b">Notificación</text><text x="1062" y="220" text-anchor="middle" class="n">puesta a disposición</text>
  </g>
  <path d="M1062 255 V315 H860" class="arrow"/><rect x="745" y="300" width="230" height="95" rx="17" fill="#fff" class="box"/><text x="860" y="340" text-anchor="middle" class="b">Recurso</text><text x="860" y="370" text-anchor="middle" class="n">cuando proceda</text>
  <path d="M745 347 H565" class="arrow"/><rect x="370" y="300" width="195" height="95" rx="17" fill="#fff" class="box"/><text x="468" y="340" text-anchor="middle" class="b">Archivo</text><text x="468" y="370" text-anchor="middle" class="n">conservación y acceso</text>
  <text x="60" y="470" class="b">Capas transversales</text>
  <rect x="55" y="505" width="250" height="85" rx="16" fill="#173a63"/><text x="180" y="540" text-anchor="middle" fill="#fff" class="b">ENS</text><text x="180" y="568" text-anchor="middle" fill="#fff" class="n">seguridad y continuidad</text>
  <rect x="335" y="505" width="250" height="85" rx="16" fill="#235d3a"/><text x="460" y="540" text-anchor="middle" fill="#fff" class="b">ENI / NTI</text><text x="460" y="568" text-anchor="middle" fill="#fff" class="n">intercambio y conservación</text>
  <rect x="615" y="505" width="250" height="85" rx="16" fill="#5a3a70"/><text x="740" y="540" text-anchor="middle" fill="#fff" class="b">RGPD</text><text x="740" y="568" text-anchor="middle" fill="#fff" class="n">licitud y minimización</text>
  <rect x="895" y="505" width="250" height="85" rx="16" fill="#785314"/><text x="1020" y="540" text-anchor="middle" fill="#fff" class="b">Accesibilidad</text><text x="1020" y="568" text-anchor="middle" fill="#fff" class="n">acceso efectivo</text>
  <rect x="275" y="630" width="650" height="55" rx="27" fill="#fff" class="box"/><text x="600" y="665" text-anchor="middle" class="k">REGISTRO ≠ DOCUMENTO ≠ EXPEDIENTE ≠ ARCHIVO</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
