<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cortes, Tribunal Constitucional y Defensor del Pueblo</title>
  <desc id="desc">Mapa institucional con Congreso y Senado dentro de las Cortes, el Tribunal Constitucional separado del Poder Judicial y el Defensor del Pueblo como alto comisionado.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:25px;font-weight:750}.n{font-size:18px}.k{font-size:16px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.link{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Tres controles distintos, tres respuestas distintas</text>
  <rect x="70" y="115" width="500" height="250" rx="20" fill="#e3efff" class="box"/><text x="320" y="160" text-anchor="middle" class="b">Cortes Generales</text>
  <rect x="105" y="195" width="190" height="120" rx="15" fill="#fff" stroke="#244f78" stroke-width="2"/><text x="200" y="235" text-anchor="middle" class="b">Congreso</text><text x="200" y="270" text-anchor="middle" class="n">investidura · confianza</text><text x="200" y="297" text-anchor="middle" class="n">censura · decisión final</text>
  <rect x="345" y="195" width="190" height="120" rx="15" fill="#fff" stroke="#244f78" stroke-width="2"/><text x="440" y="235" text-anchor="middle" class="b">Senado</text><text x="440" y="270" text-anchor="middle" class="n">representación territorial</text><text x="440" y="297" text-anchor="middle" class="n">enmienda · veto</text>
  <text x="320" y="345" text-anchor="middle" class="k">LEGISLAN · APRUEBAN PRESUPUESTOS · CONTROLAN AL GOBIERNO</text>
  <path d="M 320 365 L 320 445" class="link"/><text x="338" y="420" class="n">designan y supervisan</text>
  <rect x="70" y="465" width="500" height="165" rx="20" fill="#e9f5ec" class="box"/><text x="320" y="510" text-anchor="middle" class="b">Defensor del Pueblo</text><text x="320" y="548" text-anchor="middle" class="n">Alto comisionado de las Cortes</text><text x="320" y="580" text-anchor="middle" class="n">defiende Título I · supervisa Administración</text><text x="320" y="610" text-anchor="middle" class="k">RECOMIENDA; NO ANULA ACTOS NI SENTENCIAS</text>
  <rect x="665" y="175" width="465" height="290" rx="20" fill="#f3eafa" class="box"/><text x="898" y="225" text-anchor="middle" class="b">Tribunal Constitucional</text><text x="898" y="265" text-anchor="middle" class="n">12 magistrados · 9 años · renovación por tercios</text>
  <rect x="715" y="300" width="365" height="75" rx="15" fill="#fff" stroke="#5a3a70" stroke-width="2"/><text x="898" y="332" text-anchor="middle" class="n">Inconstitucionalidad · amparo</text><text x="898" y="359" text-anchor="middle" class="n">conflictos de competencia</text>
  <rect x="740" y="395" width="315" height="44" rx="22" fill="#5a3a70"/><text x="898" y="424" text-anchor="middle" fill="#fff" class="k">NO ES PODER JUDICIAL</text>
  <path d="M 570 240 C 625 240 620 250 665 250" class="link"/><text x="616" y="218" text-anchor="middle" class="n">proponen 4 + 4</text>
  <text x="898" y="545" text-anchor="middle" class="n">Control parlamentario ≠ control constitucional</text><text x="898" y="580" text-anchor="middle" class="n">Supervisión administrativa ≠ jurisdicción</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
