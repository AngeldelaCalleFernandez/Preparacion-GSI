<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Identificación, autenticación, autorización y firma</title>
  <desc id="desc">Cuatro pasos responden quién declara ser, cómo lo prueba, qué puede hacer y qué firma; una escalera inferior muestra firma electrónica, avanzada y cualificada.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:22px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Cuatro preguntas antes de elegir el mecanismo</text>
  <g>
    <rect x="50" y="115" width="235" height="155" rx="18" fill="#e3efff" class="box"/><text x="168" y="155" text-anchor="middle" class="b">Identificación</text><text x="168" y="195" text-anchor="middle" class="n">¿Quién declara ser?</text><text x="168" y="230" text-anchor="middle" class="k">ATRIBUYE IDENTIDAD</text>
    <path d="M285 192 H330" class="arrow"/><rect x="335" y="115" width="235" height="155" rx="18" fill="#e9f5ec" class="box"/><text x="452" y="155" text-anchor="middle" class="b">Autenticación</text><text x="452" y="195" text-anchor="middle" class="n">¿Cómo lo demuestra?</text><text x="452" y="230" text-anchor="middle" class="k">VERIFICA IDENTIDAD</text>
    <path d="M570 192 H615" class="arrow"/><rect x="620" y="115" width="235" height="155" rx="18" fill="#fff3d6" class="box"/><text x="738" y="155" text-anchor="middle" class="b">Autorización</text><text x="738" y="195" text-anchor="middle" class="n">¿Qué puede hacer?</text><text x="738" y="230" text-anchor="middle" class="k">CONCEDE PERMISOS</text>
    <path d="M855 192 H900" class="arrow"/><rect x="905" y="115" width="245" height="155" rx="18" fill="#f3eafa" class="box"/><text x="1028" y="155" text-anchor="middle" class="b">Firma electrónica</text><text x="1028" y="195" text-anchor="middle" class="n">¿Qué datos vincula?</text><text x="1028" y="230" text-anchor="middle" class="k">ACCIÓN / VOLUNTAD</text>
  </g>
  <text x="60" y="345" class="b">eIDAS · requisitos acumulativos</text>
  <rect x="80" y="540" width="330" height="100" rx="16" fill="#e3efff" class="box"/><text x="245" y="580" text-anchor="middle" class="b">Firma electrónica</text><text x="245" y="613" text-anchor="middle" class="n">categoría general</text>
  <rect x="355" y="450" width="410" height="120" rx="16" fill="#e9f5ec" class="box"/><text x="560" y="490" text-anchor="middle" class="b">Firma avanzada</text><text x="560" y="523" text-anchor="middle" class="n">vincula · identifica · control · detecta cambios</text>
  <rect x="710" y="360" width="410" height="140" rx="16" fill="#f3eafa" class="box"/><text x="915" y="402" text-anchor="middle" class="b">Firma cualificada</text><text x="915" y="438" text-anchor="middle" class="n">avanzada + dispositivo cualificado</text><text x="915" y="469" text-anchor="middle" class="n">+ certificado cualificado</text>
  <path d="M410 590 C520 590 520 560 560 570" class="arrow"/><path d="M765 505 C820 505 840 500 875 500" class="arrow"/>
  <rect x="745" y="565" width="345" height="62" rx="31" fill="#5a3a70"/><text x="918" y="603" text-anchor="middle" fill="#fff" class="k">EQUIVALENTE A MANUSCRITA EN LA UE</text>
  <text x="600" y="685" text-anchor="middle" class="n">Firma no cifra el contenido por sí sola: integridad y vinculación no equivalen a confidencialidad.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
