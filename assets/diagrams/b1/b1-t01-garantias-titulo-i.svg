<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Título I: derechos y nivel de protección</title>
  <desc id="desc">Cuatro franjas sitúan las categorías del Título I. La tutela reforzada y el amparo se destacan solo para el artículo 14, los artículos 15 a 29 y la objeción de conciencia del artículo 30.2.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.s{font-size:20px}.b{font-size:24px;font-weight:700}.n{font-size:19px}.box{stroke:#244f78;stroke-width:3}.tag{font-size:17px;font-weight:750;letter-spacing:.5px}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}
    text[fill="#fff"]{fill:#fff}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="720" rx="24" fill="#f7fbff"/>
  <text x="60" y="62" class="h">Título I · ubica primero, aplica después la garantía</text>
  <text x="60" y="98" class="s">La posición constitucional determina el régimen de protección; el color se acompaña siempre de etiqueta.</text>
  <rect x="70" y="145" width="1060" height="105" rx="18" fill="#d9eaff" class="box"/>
  <text x="105" y="185" class="b">Art. 14 · igualdad</text><text x="105" y="222" class="n">Tutela ordinaria + procedimiento preferente y sumario + recurso de amparo</text>
  <rect x="875" y="174" width="215" height="48" rx="24" fill="#173a63"/><text x="982" y="205" text-anchor="middle" fill="#fff" class="tag">TUTELA REFORZADA</text>
  <rect x="70" y="275" width="1060" height="105" rx="18" fill="#e4f4e9" class="box"/>
  <text x="105" y="315" class="b">Arts. 15–29 · derechos fundamentales y libertades públicas</text><text x="105" y="352" class="n">Contenido esencial + ley; desarrollo por ley orgánica + preferencia/sumariedad + amparo</text>
  <rect x="875" y="304" width="215" height="48" rx="24" fill="#235d3a"/><text x="982" y="335" text-anchor="middle" fill="#fff" class="tag">TUTELA REFORZADA</text>
  <rect x="70" y="405" width="1060" height="105" rx="18" fill="#fff3d6" class="box"/>
  <text x="105" y="445" class="b">Arts. 30–38 · derechos y deberes de los ciudadanos</text><text x="105" y="482" class="n">Vinculan a los poderes públicos; reserva de ley y contenido esencial (art. 53.1)</text>
  <rect x="830" y="434" width="260" height="48" rx="24" fill="#785314"/><text x="960" y="465" text-anchor="middle" fill="#fff" class="tag">EXCEPCIÓN: ART. 30.2</text>
  <path d="M 960 510 L 960 554" class="arrow"/><text x="685" y="548" class="n">Objeción de conciencia: amparo en sus términos</text>
  <rect x="70" y="575" width="1060" height="105" rx="18" fill="#f1e8f7" class="box"/>
  <text x="105" y="615" class="b">Arts. 39–52 · principios rectores</text><text x="105" y="652" class="n">Orientan legislación, práctica judicial y actuación pública</text>
  <rect x="845" y="604" width="245" height="48" rx="24" fill="#5a3a70"/><text x="968" y="635" text-anchor="middle" fill="#fff" class="tag">NO AMPARO DIRECTO</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
