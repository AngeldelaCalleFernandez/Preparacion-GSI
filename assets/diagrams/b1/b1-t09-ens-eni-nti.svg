<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Relación entre ENS, ENI, NTI y CCN-STIC</title>
  <desc id="desc">Dos columnas principales separan seguridad e interoperabilidad; debajo, las guías CCN-STIC desarrollan ENS y las NTI desarrollan ENI.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:25px;font-weight:750}.n{font-size:18px}.k{font-size:16px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.link{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="680" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Dos marcos, dos familias de desarrollo</text>
  <rect x="65" y="115" width="500" height="260" rx="22" fill="#e3efff" class="box"/><text x="315" y="162" text-anchor="middle" class="b">ENS · RD 311/2022</text><text x="315" y="205" text-anchor="middle" class="n">Protección adecuada de información y servicios</text>
  <rect x="115" y="235" width="400" height="90" rx="16" fill="#fff" stroke="#244f78" stroke-width="2"/><text x="315" y="270" text-anchor="middle" class="k">ACIDT · RIESGOS · CATEGORÍA</text><text x="315" y="300" text-anchor="middle" class="n">medidas organizativas, operacionales y de protección</text>
  <rect x="635" y="115" width="500" height="260" rx="22" fill="#e9f5ec" class="box"/><text x="885" y="162" text-anchor="middle" class="b">ENI · RD 4/2010</text><text x="885" y="205" text-anchor="middle" class="n">Intercambio y conservación con condiciones comunes</text>
  <rect x="685" y="235" width="400" height="90" rx="16" fill="#fff" stroke="#244f78" stroke-width="2"/><text x="885" y="270" text-anchor="middle" class="k">ORGANIZATIVA · SEMÁNTICA · TÉCNICA</text><text x="885" y="300" text-anchor="middle" class="n">documento, expediente, firma, estándares y conservación</text>
  <path d="M315 375 V430" class="link"/><path d="M885 375 V430" class="link"/>
  <rect x="65" y="445" width="500" height="150" rx="22" fill="#f3eafa" class="box"/><text x="315" y="490" text-anchor="middle" class="b">CCN-STIC serie 800</text><text x="315" y="530" text-anchor="middle" class="n">responsabilidades · auditoría · categorización</text><text x="315" y="560" text-anchor="middle" class="n">implantación · conformidad · incidentes</text>
  <rect x="635" y="445" width="500" height="150" rx="22" fill="#fff3d6" class="box"/><text x="885" y="490" text-anchor="middle" class="b">Normas Técnicas de Interoperabilidad</text><text x="885" y="530" text-anchor="middle" class="n">concretan documento, expediente, digitalización</text><text x="885" y="560" text-anchor="middle" class="n">firma, datos, Red SARA y gestión documental</text>
  <rect x="315" y="620" width="570" height="42" rx="21" fill="#173a63"/><text x="600" y="648" text-anchor="middle" fill="#fff" class="k">ENS PROTEGE · ENI CONECTA Y CONSERVA</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
