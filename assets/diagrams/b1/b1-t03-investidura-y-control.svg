<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Investidura y responsabilidad política</title>
  <desc id="desc">Línea temporal de la investidura y tres tarjetas con las mayorías de investidura, cuestión de confianza y moción de censura.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:22px;font-weight:750}.n{font-size:18px}.k{font-size:17px;font-weight:750}.line{stroke:#245c91;stroke-width:5}.box{stroke:#244f78;stroke-width:3}</style>
  <rect width="1200" height="690" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Gobierno y Congreso · memoriza secuencia y mayoría</text>
  <line x1="120" y1="180" x2="1080" y2="180" class="line"/>
  <circle cx="140" cy="180" r="22" fill="#173a63"/><circle cx="390" cy="180" r="22" fill="#173a63"/><circle cx="645" cy="180" r="22" fill="#173a63"/><circle cx="900" cy="180" r="22" fill="#173a63"/><circle cx="1070" cy="180" r="22" fill="#173a63"/>
  <text x="140" y="125" text-anchor="middle" class="b">Consultas</text><text x="140" y="230" text-anchor="middle" class="n">Rey → propuesta</text>
  <text x="390" y="125" text-anchor="middle" class="b">Programa</text><text x="390" y="230" text-anchor="middle" class="n">candidato ante Congreso</text>
  <text x="645" y="125" text-anchor="middle" class="b">1.ª votación</text><text x="645" y="230" text-anchor="middle" class="n">mayoría absoluta</text>
  <text x="900" y="125" text-anchor="middle" class="b">+48 horas</text><text x="900" y="230" text-anchor="middle" class="n">mayoría simple</text>
  <text x="1070" y="125" text-anchor="middle" class="b">Nombramiento</text><text x="1070" y="230" text-anchor="middle" class="n">por el Rey</text>
  <rect x="765" y="270" width="370" height="72" rx="16" fill="#fff3d6" stroke="#8b5a12" stroke-width="3"/><text x="950" y="300" text-anchor="middle" class="k">SI NADIE ES INVESTIDO</text><text x="950" y="327" text-anchor="middle" class="n">2 meses desde la primera votación → elecciones</text>
  <rect x="60" y="400" width="340" height="220" rx="20" fill="#e3efff" class="box"/><text x="230" y="450" text-anchor="middle" class="b">Investidura</text><text x="230" y="492" text-anchor="middle" class="n">1.ª: absoluta</text><text x="230" y="525" text-anchor="middle" class="n">2.ª: simple</text><text x="230" y="575" text-anchor="middle" class="k">CONFIANZA INICIAL</text>
  <rect x="430" y="400" width="340" height="220" rx="20" fill="#e9f5ec" class="box"/><text x="600" y="450" text-anchor="middle" class="b">Cuestión de confianza</text><text x="600" y="492" text-anchor="middle" class="n">la plantea el Presidente</text><text x="600" y="525" text-anchor="middle" class="n">mayoría simple</text><text x="600" y="575" text-anchor="middle" class="k">CONFIRMA APOYO</text>
  <rect x="800" y="400" width="340" height="220" rx="20" fill="#f3eafa" class="box"/><text x="970" y="450" text-anchor="middle" class="b">Moción de censura</text><text x="970" y="492" text-anchor="middle" class="n">incluye candidato</text><text x="970" y="525" text-anchor="middle" class="n">mayoría absoluta</text><text x="970" y="575" text-anchor="middle" class="k">CONSTRUCTIVA</text>
  <text x="600" y="665" text-anchor="middle" class="n">La responsabilidad política del Gobierno se exige ante el Congreso, no ante el Senado.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
