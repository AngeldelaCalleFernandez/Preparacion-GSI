<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fases del procedimiento administrativo</title>
  <desc id="desc">Flujo principal de iniciación, ordenación, instrucción, finalización, ejecución y recurso, con trámites típicos asociados.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:22px;font-weight:750}.n{font-size:17px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#7b8fa5;stroke-width:3;stroke-dasharray:8 7;fill:none}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="700" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Procedimiento común · secuencia y función de cada fase</text>
  <rect x="55" y="145" width="190" height="130" rx="18" fill="#e3efff" class="box"/><text x="150" y="185" text-anchor="middle" class="b">Iniciación</text><text x="150" y="220" text-anchor="middle" class="n">de oficio</text><text x="150" y="248" text-anchor="middle" class="n">o a solicitud</text>
  <path d="M245 210 H285" class="arrow"/><rect x="290" y="145" width="190" height="130" rx="18" fill="#e9f5ec" class="box"/><text x="385" y="185" text-anchor="middle" class="b">Ordenación</text><text x="385" y="220" text-anchor="middle" class="n">impulso · celeridad</text><text x="385" y="248" text-anchor="middle" class="n">orden de trámites</text>
  <path d="M480 210 H520" class="arrow"/><rect x="525" y="125" width="250" height="170" rx="18" fill="#fff3d6" class="box"/><text x="650" y="165" text-anchor="middle" class="b">Instrucción</text><text x="650" y="202" text-anchor="middle" class="n">alegaciones · prueba</text><text x="650" y="232" text-anchor="middle" class="n">informes · audiencia</text><text x="650" y="262" text-anchor="middle" class="n">información pública</text>
  <path d="M775 210 H815" class="arrow"/><rect x="820" y="125" width="325" height="170" rx="18" fill="#f3eafa" class="box"/><text x="982" y="165" text-anchor="middle" class="b">Finalización</text><text x="982" y="202" text-anchor="middle" class="n">resolución · desistimiento</text><text x="982" y="232" text-anchor="middle" class="n">renuncia · caducidad</text><text x="982" y="262" text-anchor="middle" class="n">imposibilidad · convenio</text>
  <rect x="55" y="365" width="240" height="105" rx="18" fill="#fff" class="box"/><text x="175" y="405" text-anchor="middle" class="b">Subsanación</text><text x="175" y="440" text-anchor="middle" class="n">10 días · posible +5</text><path d="M175 365 V280" class="dash"/>
  <rect x="360" y="365" width="240" height="105" rx="18" fill="#fff" class="box"/><text x="480" y="405" text-anchor="middle" class="b">Plazos y registro</text><text x="480" y="440" text-anchor="middle" class="n">atraviesan el flujo</text><path d="M480 365 V280" class="dash"/>
  <rect x="665" y="365" width="240" height="105" rx="18" fill="#fff" class="box"/><text x="785" y="405" text-anchor="middle" class="b">Ejecución</text><text x="785" y="440" text-anchor="middle" class="n">eficacia del acto</text><path d="M982 295 V330 H785 V365" class="arrow"/>
  <rect x="970" y="365" width="175" height="105" rx="18" fill="#fff" class="box"/><text x="1058" y="405" text-anchor="middle" class="b">Recurso</text><text x="1058" y="440" text-anchor="middle" class="n">si procede</text><path d="M905 417 H965" class="arrow"/>
  <rect x="210" y="545" width="780" height="85" rx="20" fill="#173a63"/><text x="600" y="580" text-anchor="middle" fill="#fff" class="b">Ordenación impulsa · Instrucción prepara · Finalización decide o cierra</text><text x="600" y="610" text-anchor="middle" fill="#fff" class="n">Resolución es una forma de finalización, no la única.</text>
  <text x="600" y="674" text-anchor="middle" class="n">La tramitación simplificada conserva la lógica básica, pero selecciona trámites y fija su propio plazo.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
