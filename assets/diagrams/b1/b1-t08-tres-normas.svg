<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Ruta de estudio de las Leyes 39 y 40 y el TREBEP</title>
  <desc id="desc">Tres columnas responden cómo se tramita, quién organiza y con qué personal actúa la Administración.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.q{font-size:21px;font-weight:700}.b{font-size:26px;font-weight:750}.n{font-size:18px}.k{font-size:16px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.link{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="650" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Tres normas · tres preguntas · una actuación administrativa</text>
  <rect x="55" y="120" width="340" height="390" rx="22" fill="#e3efff" class="box"/><text x="225" y="165" text-anchor="middle" class="q">¿Cómo se tramita?</text><text x="225" y="215" text-anchor="middle" class="b">Ley 39/2015</text><text x="225" y="250" text-anchor="middle" class="k">LPAC · AD EXTRA</text>
  <text x="95" y="305" class="n">• interesados y representación</text><text x="95" y="343" class="n">• registro, plazos y silencio</text><text x="95" y="381" class="n">• fases y notificación</text><text x="95" y="419" class="n">• actos, revisión y recursos</text>
  <rect x="430" y="120" width="340" height="390" rx="22" fill="#e9f5ec" class="box"/><text x="600" y="165" text-anchor="middle" class="q">¿Quién actúa y cómo?</text><text x="600" y="215" text-anchor="middle" class="b">Ley 40/2015</text><text x="600" y="250" text-anchor="middle" class="k">LRJSP · AD INTRA</text>
  <text x="470" y="305" class="n">• órganos y competencia</text><text x="470" y="343" class="n">• delegación y avocación</text><text x="470" y="381" class="n">• sanción y responsabilidad</text><text x="470" y="419" class="n">• relaciones entre AAPP</text>
  <rect x="805" y="120" width="340" height="390" rx="22" fill="#f3eafa" class="box"/><text x="975" y="165" text-anchor="middle" class="q">¿Con qué personal?</text><text x="975" y="215" text-anchor="middle" class="b">RDL 5/2015</text><text x="975" y="250" text-anchor="middle" class="k">TREBEP · EMPLEO PÚBLICO</text>
  <text x="845" y="305" class="n">• clases de empleados</text><text x="845" y="343" class="n">• acceso, carrera y provisión</text><text x="845" y="381" class="n">• derechos y deberes</text><text x="845" y="419" class="n">• situaciones y disciplina</text>
  <path d="M225 510 V565 H540" class="link"/><path d="M600 510 V565" class="link"/><path d="M975 510 V565 H660" class="link"/>
  <rect x="410" y="550" width="380" height="65" rx="32" fill="#173a63"/><text x="600" y="591" text-anchor="middle" fill="#fff" class="q">EXPEDIENTE + ÓRGANO + PERSONAL</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
</svg>
