<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Servicios comunes en un trámite público</title>
  <desc id="desc">Cadena de tramitación con Clave, registro, expediente, intermediación, firma, notificación y archivo, más servicios de catálogo e infraestructura.</desc>
  <style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172b42}.h{font-size:34px;font-weight:750}.b{font-size:19px;font-weight:750}.n{font-size:15px}.k{font-size:15px;font-weight:750}.box{stroke:#244f78;stroke-width:3}.arrow{stroke:#244f78;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#244f78"/></marker></defs>
  <rect width="1200" height="760" rx="24" fill="#f7fbff"/><text x="60" y="60" class="h">Reutiliza capacidades comunes · ubica cada servicio</text>
  <g>
    <rect x="40" y="140" width="135" height="105" rx="16" fill="#e3efff" class="box"/><text x="108" y="180" text-anchor="middle" class="b">Sede</text><text x="108" y="211" text-anchor="middle" class="n">front / trámite</text>
    <path d="M175 192 H205" class="arrow"/><rect x="210" y="140" width="135" height="105" rx="16" fill="#e9f5ec" class="box"/><text x="278" y="180" text-anchor="middle" class="b">Cl@ve</text><text x="278" y="211" text-anchor="middle" class="n">identidad</text>
    <path d="M345 192 H375" class="arrow"/><rect x="380" y="140" width="135" height="105" rx="16" fill="#fff3d6" class="box"/><text x="448" y="180" text-anchor="middle" class="b">Registro</text><text x="448" y="211" text-anchor="middle" class="n">SIR / GEISER</text>
    <path d="M515 192 H545" class="arrow"/><rect x="550" y="140" width="135" height="105" rx="16" fill="#fff" class="box"/><text x="618" y="180" text-anchor="middle" class="b">Expediente</text><text x="618" y="211" text-anchor="middle" class="n">INSIDE</text>
    <path d="M685 192 H715" class="arrow"/><rect x="720" y="140" width="135" height="105" rx="16" fill="#e8f4f7" class="box"/><text x="788" y="180" text-anchor="middle" class="b">Datos</text><text x="788" y="211" text-anchor="middle" class="n">PID</text>
    <path d="M855 192 H885" class="arrow"/><rect x="890" y="140" width="135" height="105" rx="16" fill="#f3eafa" class="box"/><text x="958" y="180" text-anchor="middle" class="b">Firma</text><text x="958" y="211" text-anchor="middle" class="n">@firma / FIRe</text>
    <path d="M1025 192 H1055" class="arrow"/><rect x="1060" y="140" width="105" height="105" rx="16" fill="#fff1e6" class="box"/><text x="1112" y="180" text-anchor="middle" class="b">DEHú</text><text x="1112" y="211" text-anchor="middle" class="n">notifica</text>
  </g>
  <path d="M1112 245 V315 H895" class="arrow"/><rect x="720" y="300" width="205" height="95" rx="17" fill="#fff" class="box"/><text x="822" y="338" text-anchor="middle" class="b">Archivo</text><text x="822" y="368" text-anchor="middle" class="n">conservación</text>
  <rect x="55" y="470" width="250" height="100" rx="18" fill="#173a63"/><text x="180" y="508" text-anchor="middle" fill="#fff" class="b">DIR3</text><text x="180" y="540" text-anchor="middle" fill="#fff" class="n">unidades y oficinas</text>
  <rect x="335" y="470" width="250" height="100" rx="18" fill="#235d3a"/><text x="460" y="508" text-anchor="middle" fill="#fff" class="b">SIA</text><text x="460" y="540" text-anchor="middle" fill="#fff" class="n">procedimientos y servicios</text>
  <rect x="615" y="470" width="250" height="100" rx="18" fill="#5a3a70"/><text x="740" y="508" text-anchor="middle" fill="#fff" class="b">Red SARA</text><text x="740" y="540" text-anchor="middle" fill="#fff" class="n">interconexión entre AAPP</text>
  <rect x="895" y="470" width="250" height="100" rx="18" fill="#785314"/><text x="1020" y="508" text-anchor="middle" fill="#fff" class="b">Representa</text><text x="1020" y="540" text-anchor="middle" fill="#fff" class="n">poderes y representación</text>
  <rect x="90" y="625" width="1020" height="70" rx="22" fill="#e3efff" class="box"/><text x="600" y="653" text-anchor="middle" class="k">CAPAS TRANSVERSALES</text><text x="600" y="680" text-anchor="middle" class="n">ENS · ENI/NTI · RGPD · trazabilidad · accesibilidad · continuidad</text>
  <text x="600" y="735" text-anchor="middle" class="n">SIR intercambia asientos; GEISER gestiona registro. @firma valida; AutoFirma firma en el puesto del usuario.</text>
  <style>text[fill="#fff"]{fill:#fff}</style>
