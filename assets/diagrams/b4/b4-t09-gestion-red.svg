<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d"><title id="t">Gestión de red y SNMP</title><desc id="d">Agentes SNMP, syslog, flujos y telemetría alimentan una plataforma NMS que correlaciona y genera alertas.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="470" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Una red se gestiona con señales complementarias</text><rect class="b x" x="35" y="95" width="250" height="250" rx="16"/><text class="t" x="160" y="132" text-anchor="middle">Dispositivos y agentes</text><text class="s" x="160" y="170" text-anchor="middle">MIB describe · OID identifica</text><text class="s" x="160" y="204" text-anchor="middle">GET · GETNEXT · GETBULK</text><text class="s" x="160" y="238" text-anchor="middle">TRAP · INFORM</text><text class="s" x="160" y="272" text-anchor="middle">SNMPv3 auth / privacy</text><text class="s" x="160" y="306" text-anchor="middle">config y AAA separados</text><path class="l" d="M285 220H380"/><rect class="b z" x="380" y="95" width="320" height="250" rx="16"/><text class="t" x="540" y="132" text-anchor="middle">NMS / correlación</text><text class="s" x="540" y="170" text-anchor="middle">polling y eventos</text><text class="s" x="540" y="204" text-anchor="middle">inventario · baseline · topología</text><text class="s" x="540" y="238" text-anchor="middle">dashboards · umbrales · tendencias</text><text class="s" x="540" y="272" text-anchor="middle">deduplicar tormentas</text><text class="s" x="540" y="306" text-anchor="middle">alarma → ticket → diagnóstico</text><path class="l" d="M700 220H795"/><rect class="b y" x="795" y="95" width="250" height="250" rx="16"/><text class="t" x="920" y="132" text-anchor="middle">Otras señales</text><text class="s" x="920" y="170" text-anchor="middle">syslog: eventos</text><text class="s" x="920" y="204" text-anchor="middle">NetFlow/IPFIX: conversaciones</text><text class="s" x="920" y="238" text-anchor="middle">telemetría: series frecuentes</text><text class="s" x="920" y="272" text-anchor="middle">config backup: estado</text><text class="s" x="920" y="306" text-anchor="middle">QoS: congestión, no capacidad</text><text class="s" x="540" y="415" text-anchor="middle">FCAPS estructura fallos, configuración, uso, rendimiento y seguridad; no es una herramienta.</text></svg>
