<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="t d"><title id="t">Arquitectura y capacidad de videoconferencia</title><desc id="d">Cadena de señalización y medios con WebRTC, SIP, RTP, MCU o SFU y fórmula de dimensionamiento.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1120" height="500" rx="22"/><text class="h" x="560" y="43" text-anchor="middle">Protocolos, arquitectura multipunto, red y sala forman un sistema</text><rect class="b x" x="35" y="95" width="180" height="130" rx="14"/><text class="t" x="125" y="132" text-anchor="middle">Captura</text><text class="s" x="125" y="163" text-anchor="middle">cámara · micrófono</text><text class="s" x="125" y="189" text-anchor="middle">H.264/AV1 · Opus</text><rect class="b z" x="255" y="95" width="240" height="130" rx="14"/><text class="t" x="375" y="132" text-anchor="middle">Negociación</text><text class="s" x="375" y="163" text-anchor="middle">SIP / H.323 / WebRTC</text><text class="s" x="375" y="189" text-anchor="middle">SDP · ICE · STUN · TURN</text><rect class="b y" x="535" y="95" width="240" height="130" rx="14"/><text class="t" x="655" y="132" text-anchor="middle">Medios</text><text class="s" x="655" y="163" text-anchor="middle">RTP · RTCP · SRTP</text><text class="s" x="655" y="189" text-anchor="middle">latencia · jitter · pérdida</text><rect class="b x" x="815" y="95" width="270" height="130" rx="14"/><text class="t" x="950" y="132" text-anchor="middle">Multipunto</text><text class="s" x="950" y="163" text-anchor="middle">MCU mezcla y recodifica</text><text class="s" x="950" y="189" text-anchor="middle">SFU selecciona y reenvía</text><path class="l" d="M215 160H255M495 160H535M775 160H815"/><rect class="b" x="60" y="285" width="465" height="130" rx="15"/><text class="t" x="292" y="322" text-anchor="middle">Dimensionamiento</text><text class="s" x="292" y="353" text-anchor="middle">bitrate por flujo × concurrencia × direcciones</text><text class="s" x="292" y="379" text-anchor="middle">+ overhead + presentaciones/simulcast + margen</text><rect class="b z" x="565" y="285" width="495" height="130" rx="15"/><text class="t" x="812" y="322" text-anchor="middle">Calidad de extremo a extremo</text><text class="s" x="812" y="353" text-anchor="middle">QoS coherente · WAN/Internet · uplink/downlink · redundancia</text><text class="s" x="812" y="379" text-anchor="middle">acústica · eco · luz · subtítulos · seguridad · grabación</text><text class="s" x="560" y="463" text-anchor="middle">WebRTC no es un codec · STUN descubre · TURN relaya · dimensionar por simultaneidad real</text></svg>
