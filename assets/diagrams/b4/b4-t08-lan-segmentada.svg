<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">LAN segmentada y segura</title><desc id="d">Terminales en VLAN, switches de acceso y distribución, routing inter-VLAN y firewall con controles de acceso.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Segmentar broadcast y controlar flujos son tareas distintas</text><rect class="b x" x="35" y="90" width="230" height="125" rx="14"/><text class="t" x="150" y="127" text-anchor="middle">VLAN usuarios</text><text class="s" x="150" y="158" text-anchor="middle">terminales · 802.1X</text><text class="s" x="150" y="184" text-anchor="middle">puerto de acceso</text><rect class="b y" x="35" y="265" width="230" height="125" rx="14"/><text class="t" x="150" y="302" text-anchor="middle">VLAN voz / IoT</text><text class="s" x="150" y="333" text-anchor="middle">PoE · políticas específicas</text><text class="s" x="150" y="359" text-anchor="middle">NAC · port security</text><path class="l" d="M265 152H355M265 327H355"/><rect class="b" x="355" y="120" width="230" height="250" rx="16"/><text class="t" x="470" y="157" text-anchor="middle">Acceso / distribución</text><text class="s" x="470" y="193" text-anchor="middle">switch aprende MAC origen</text><text class="s" x="470" y="225" text-anchor="middle">trunk 802.1Q</text><text class="s" x="470" y="257" text-anchor="middle">STP/RSTP evita bucles</text><text class="s" x="470" y="289" text-anchor="middle">LACP agrega enlaces</text><text class="s" x="470" y="321" text-anchor="middle">VLAN limita broadcast</text><path class="l" d="M585 245H675"/><rect class="b z" x="675" y="120" width="180" height="250" rx="16"/><text class="t" x="765" y="157" text-anchor="middle">Capa 3</text><text class="s" x="765" y="193" text-anchor="middle">gateway</text><text class="s" x="765" y="225" text-anchor="middle">routing inter-VLAN</text><text class="s" x="765" y="257" text-anchor="middle">prefijos · redundancia</text><text class="s" x="765" y="289" text-anchor="middle">ACL</text><path class="l" d="M855 245H925"/><rect class="b y" x="925" y="120" width="130" height="250" rx="16"/><text class="t" x="990" y="157" text-anchor="middle">Firewall</text><text class="s" x="990" y="198" text-anchor="middle">zonas</text><text class="s" x="990" y="230" text-anchor="middle">mínimo flujo</text><text class="s" x="990" y="262" text-anchor="middle">logs</text><text class="s" x="990" y="294" text-anchor="middle">Internet</text><text class="s" x="540" y="438" text-anchor="middle">VLAN no es una frontera suficiente de seguridad: el flujo entre zonas requiere política y evidencia.</text></svg>
