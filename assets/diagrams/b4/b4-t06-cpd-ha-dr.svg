<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="t d"><title id="t">Alta disponibilidad y recuperación de un CPD</title><desc id="d">Un sitio con redundancia de energía, red, cómputo y almacenamiento para HA, y una segunda sede para DR.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 19px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none;stroke-dasharray:8 6}</style></defs><rect class="g" width="1100" height="490" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">HA protege el servicio local; DR cubre la pérdida del sitio</text><rect class="b x" x="40" y="80" width="650" height="320" rx="18"/><text class="t" x="365" y="116" text-anchor="middle">Sitio A · alta disponibilidad</text><rect class="b" x="75" y="145" width="175" height="95" rx="13"/><text class="t" x="162" y="179" text-anchor="middle">Energía</text><text class="s" x="162" y="207" text-anchor="middle">red · UPS · PDU · grupo</text><rect class="b" x="275" y="145" width="175" height="95" rx="13"/><text class="t" x="362" y="179" text-anchor="middle">Red</text><text class="s" x="362" y="207" text-anchor="middle">doble camino · balanceo</text><rect class="b" x="475" y="145" width="175" height="95" rx="13"/><text class="t" x="562" y="179" text-anchor="middle">Climatización</text><text class="s" x="562" y="207" text-anchor="middle">N+1 / 2N según riesgo</text><rect class="b y" x="75" y="275" width="270" height="90" rx="13"/><text class="t" x="210" y="309" text-anchor="middle">Cluster de hosts</text><text class="s" x="210" y="337" text-anchor="middle">anti-affinity · quorum · fencing</text><rect class="b y" x="380" y="275" width="270" height="90" rx="13"/><text class="t" x="515" y="309" text-anchor="middle">Storage redundante</text><text class="s" x="515" y="337" text-anchor="middle">capacidad para fallos y mantenimiento</text><rect class="b z" x="760" y="80" width="300" height="320" rx="18"/><text class="t" x="910" y="116" text-anchor="middle">Sitio B · DR</text><text class="s" x="910" y="160" text-anchor="middle">cold · warm · hot</text><text class="s" x="910" y="195" text-anchor="middle">réplica + backups</text><text class="s" x="910" y="230" text-anchor="middle">identidad · certificados</text><text class="s" x="910" y="265" text-anchor="middle">DNS / routing</text><text class="s" x="910" y="300" text-anchor="middle">runbook · failover</text><text class="s" x="910" y="335" text-anchor="middle">failback probado</text><path class="l" d="M690 235H760"/><text class="s" x="725" y="220" text-anchor="middle">RPO/RTO</text><text class="s" x="550" y="452" text-anchor="middle">Live migration no es DR; dos nodos en el mismo dominio físico no cubren un desastre de sede.</text></svg>
