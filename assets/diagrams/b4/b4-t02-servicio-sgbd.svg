<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">SGBD como servicio recuperable</title><desc id="d">Arquitectura del motor y sus controles de rendimiento, seguridad, copia, replicación, alta disponibilidad y recuperación.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Administrar datos y administrar el servicio no son lo mismo</text><rect class="b x" x="315" y="80" width="450" height="75" rx="14"/><text class="t" x="540" y="110" text-anchor="middle">Conexiones · autenticación · roles · TLS</text><text class="s" x="540" y="136" text-anchor="middle">cuentas de aplicación separadas de administración</text><path class="l" d="M540 155V190"/><rect class="b" x="180" y="190" width="720" height="120" rx="16"/><text class="t" x="540" y="221" text-anchor="middle">Instancia / motor</text><text class="s" x="540" y="250" text-anchor="middle">procesos · memoria · buffer pool · planes · locks/MVCC</text><text class="s" x="540" y="278" text-anchor="middle">datos · índices · temporales · WAL/log de transacciones</text><path class="l" d="M300 310V350M540 310V350M780 310V350"/><rect class="b z" x="80" y="350" width="300" height="90" rx="14"/><text class="t" x="230" y="382" text-anchor="middle">Medir y ajustar</text><text class="s" x="230" y="411" text-anchor="middle">latencia · waits · I/O · cardinalidad</text><rect class="b y" x="390" y="350" width="300" height="90" rx="14"/><text class="t" x="540" y="382" text-anchor="middle">Backup + PITR</text><text class="s" x="540" y="411" text-anchor="middle">retención · restore probado</text><rect class="b x" x="700" y="350" width="300" height="90" rx="14"/><text class="t" x="850" y="382" text-anchor="middle">Réplica + HA/DR</text><text class="s" x="850" y="411" text-anchor="middle">failover · RPO/RTO · dominio</text><text class="s" x="540" y="469" text-anchor="middle">Réplica ≠ backup · índice ≠ mejora universal · snapshot ≠ copia independiente</text></svg>
