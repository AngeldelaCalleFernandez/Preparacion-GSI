<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">Ciclo de operación segura del sistema operativo</title><desc id="d">Ciclo desde imagen y baseline hasta configuración, identidad, servicios, monitorización, parcheo, backup y recuperación.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Operar el SO es mantener un estado conocido y recuperable</text><path class="l" d="M165 145H195M325 145H355M485 145H515M645 145H675M805 145H835M965 145H1010M1055 195V275M1010 325H880M750 325H620M490 325H360M230 325H165M100 275V195"/><g><rect class="b x" x="35" y="95" width="130" height="100" rx="13"/><text class="t" x="100" y="132" text-anchor="middle">Imagen</text><text class="s" x="100" y="160" text-anchor="middle">baseline</text><rect class="b" x="195" y="95" width="130" height="100" rx="13"/><text class="t" x="260" y="132" text-anchor="middle">Configurar</text><text class="s" x="260" y="160" text-anchor="middle">red · tiempo</text><rect class="b" x="355" y="95" width="130" height="100" rx="13"/><text class="t" x="420" y="132" text-anchor="middle">Identidad</text><text class="s" x="420" y="160" text-anchor="middle">mínimo privilegio</text><rect class="b" x="515" y="95" width="130" height="100" rx="13"/><text class="t" x="580" y="132" text-anchor="middle">Servicios</text><text class="s" x="580" y="160" text-anchor="middle">cuenta · puertos</text><rect class="b" x="675" y="95" width="130" height="100" rx="13"/><text class="t" x="740" y="132" text-anchor="middle">Storage</text><text class="s" x="740" y="160" text-anchor="middle">cuotas · espacio</text><rect class="b z" x="835" y="95" width="130" height="100" rx="13"/><text class="t" x="900" y="132" text-anchor="middle">Observar</text><text class="s" x="900" y="160" text-anchor="middle">logs · métricas</text><rect class="b y" x="1010" y="95" width="90" height="100" rx="13"/><text class="t" x="1055" y="132" text-anchor="middle">Alertar</text><text class="s" x="1055" y="160" text-anchor="middle">baseline</text></g><rect class="b y" x="880" y="275" width="220" height="100" rx="13"/><text class="t" x="990" y="312" text-anchor="middle">Parchear y verificar</text><text class="s" x="990" y="340" text-anchor="middle">anillos · rollback</text><rect class="b x" x="620" y="275" width="220" height="100" rx="13"/><text class="t" x="730" y="312" text-anchor="middle">Hardening</text><text class="s" x="730" y="340" text-anchor="middle">servicios · firewall · EDR</text><rect class="b" x="360" y="275" width="220" height="100" rx="13"/><text class="t" x="470" y="312" text-anchor="middle">Automatizar</text><text class="s" x="470" y="340" text-anchor="middle">idempotencia · secretos</text><rect class="b z" x="100" y="275" width="220" height="100" rx="13"/><text class="t" x="210" y="312" text-anchor="middle">Recuperar</text><text class="s" x="210" y="340" text-anchor="middle">backup · runbook · prueba</text><text class="s" x="540" y="435" text-anchor="middle">Repetir la automatización debe mantener el estado objetivo y dejar evidencia.</text></svg>
