<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Internet e Internet de las Cosas</title><desc id="d">Internet como red de sistemas autónomos y una cadena IoT desde dispositivo hasta aplicación.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Red de redes + ciclo de vida del dispositivo conectado</text><rect class="b x" x="40" y="85" width="1020" height="120" rx="16"/><text class="t" x="550" y="118" text-anchor="middle">Internet distribuida</text><text class="s" x="550" y="150" text-anchor="middle">AS y BGP intercambian prefijos · operadores e IXP conectan redes · DNS resuelve nombres</text><text class="s" x="550" y="178" text-anchor="middle">CDN/edge acercan contenido · IPv4/IPv6 transportan · HTTP/3 usa QUIC sobre UDP</text><path class="l" d="M550 205V245"/><rect class="b" x="30" y="245" width="160" height="120" rx="14"/><text class="t" x="110" y="282" text-anchor="middle">Dispositivo</text><text class="s" x="110" y="312" text-anchor="middle">sensor / actuador</text><text class="s" x="110" y="338" text-anchor="middle">identidad · firmware</text><rect class="b x" x="210" y="245" width="160" height="120" rx="14"/><text class="t" x="290" y="282" text-anchor="middle">Acceso</text><text class="s" x="290" y="312" text-anchor="middle">Wi-Fi · móvil</text><text class="s" x="290" y="338" text-anchor="middle">LPWAN · Ethernet</text><rect class="b z" x="390" y="245" width="160" height="120" rx="14"/><text class="t" x="470" y="282" text-anchor="middle">Gateway / edge</text><text class="s" x="470" y="312" text-anchor="middle">filtrar · responder</text><text class="s" x="470" y="338" text-anchor="middle">modo desconectado</text><rect class="b" x="570" y="245" width="160" height="120" rx="14"/><text class="t" x="650" y="282" text-anchor="middle">Broker</text><text class="s" x="650" y="312" text-anchor="middle">MQTT pub/sub</text><text class="s" x="650" y="338" text-anchor="middle">CoAP REST/UDP</text><rect class="b y" x="750" y="245" width="160" height="120" rx="14"/><text class="t" x="830" y="282" text-anchor="middle">Plataforma</text><text class="s" x="830" y="312" text-anchor="middle">datos · reglas</text><text class="s" x="830" y="338" text-anchor="middle">inventario · OTA</text><rect class="b x" x="930" y="245" width="140" height="120" rx="14"/><text class="t" x="1000" y="282" text-anchor="middle">Aplicación</text><text class="s" x="1000" y="312" text-anchor="middle">alerta · decisión</text><text class="s" x="1000" y="338" text-anchor="middle">ciclo de soporte</text><text class="s" x="550" y="432" text-anchor="middle">NAT no es firewall; un dispositivo sin actualización segura crea deuda durante toda su vida útil.</text></svg>
