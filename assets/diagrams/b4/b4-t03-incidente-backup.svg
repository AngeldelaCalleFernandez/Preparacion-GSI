<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Incidentes y copias recuperables</title><desc id="d">Flujo de gestión de incidentes y problemas junto a la cadena de copia, protección, restauración y validación.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fee2e2;stroke:#b91c1c}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="500" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Restaurar el servicio y eliminar la causa son objetivos distintos</text><text class="t" x="550" y="82" text-anchor="middle">Incidente</text><path class="l" d="M170 145H200M330 145H360M490 145H520M650 145H680M810 145H840M970 145H1000"/><g><rect class="b z" x="40" y="100" width="130" height="90" rx="12"/><text class="t" x="105" y="133" text-anchor="middle">Detectar</text><text class="s" x="105" y="160" text-anchor="middle">registrar</text><rect class="b" x="200" y="100" width="130" height="90" rx="12"/><text class="t" x="265" y="133" text-anchor="middle">Priorizar</text><text class="s" x="265" y="160" text-anchor="middle">impacto × urgencia</text><rect class="b" x="360" y="100" width="130" height="90" rx="12"/><text class="t" x="425" y="133" text-anchor="middle">Diagnóstico</text><text class="s" x="425" y="160" text-anchor="middle">escalar</text><rect class="b y" x="520" y="100" width="130" height="90" rx="12"/><text class="t" x="585" y="133" text-anchor="middle">Recuperar</text><text class="s" x="585" y="160" text-anchor="middle">validar</text><rect class="b" x="680" y="100" width="130" height="90" rx="12"/><text class="t" x="745" y="133" text-anchor="middle">Comunicar</text><text class="s" x="745" y="160" text-anchor="middle">cerrar</text><rect class="b x" x="840" y="100" width="130" height="90" rx="12"/><text class="t" x="905" y="133" text-anchor="middle">Problema</text><text class="s" x="905" y="160" text-anchor="middle">causa raíz</text><rect class="b" x="1000" y="100" width="80" height="90" rx="12"/><text class="t" x="1040" y="133" text-anchor="middle">Acción</text><text class="s" x="1040" y="160" text-anchor="middle">prevenir</text></g><text class="t" x="550" y="242" text-anchor="middle">Backup recuperable</text><path class="l" d="M225 330H285M465 330H525M705 330H765"/><rect class="b x" x="45" y="275" width="180" height="110" rx="14"/><text class="t" x="135" y="311" text-anchor="middle">Copiar</text><text class="s" x="135" y="340" text-anchor="middle">completa · incremental</text><text class="s" x="135" y="364" text-anchor="middle">diferencial · consistente</text><rect class="b" x="285" y="275" width="180" height="110" rx="14"/><text class="t" x="375" y="311" text-anchor="middle">Proteger</text><text class="s" x="375" y="340" text-anchor="middle">offsite · inmutable</text><text class="s" x="375" y="364" text-anchor="middle">credenciales separadas</text><rect class="b y" x="525" y="275" width="180" height="110" rx="14"/><text class="t" x="615" y="311" text-anchor="middle">Restaurar</text><text class="s" x="615" y="340" text-anchor="middle">infra + app + datos</text><text class="s" x="615" y="364" text-anchor="middle">runbook ensayado</text><rect class="b x" x="765" y="275" width="290" height="110" rx="14"/><text class="t" x="910" y="311" text-anchor="middle">Validar contra objetivos</text><text class="s" x="910" y="340" text-anchor="middle">integridad funcional · RPO</text><text class="s" x="910" y="364" text-anchor="middle">tiempo medido ≤ RTO</text><text class="s" x="550" y="445" text-anchor="middle">3-2-1-1-0 es una práctica adaptable al riesgo, no una