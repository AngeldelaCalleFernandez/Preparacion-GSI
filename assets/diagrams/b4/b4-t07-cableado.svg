<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Cableado estructurado y medios</title><desc id="d">Desde entrada de servicios y distribuidor principal por backbone hasta distribuidores, patch panels y áreas de trabajo.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:4;fill:none}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Una infraestructura documentada desde el operador hasta el puesto</text><path class="l" d="M190 160H245M425 160H480M660 160H715M895 160H950"/><rect class="b x" x="35" y="100" width="155" height="120" rx="14"/><text class="t" x="112" y="136" text-anchor="middle">Entrada</text><text class="s" x="112" y="166" text-anchor="middle">operadores</text><text class="s" x="112" y="192" text-anchor="middle">protección</text><rect class="b z" x="245" y="100" width="180" height="120" rx="14"/><text class="t" x="335" y="136" text-anchor="middle">MDF / principal</text><text class="s" x="335" y="166" text-anchor="middle">racks · patch</text><text class="s" x="335" y="192" text-anchor="middle">equipamiento</text><rect class="b x" x="480" y="100" width="180" height="120" rx="14"/><text class="t" x="570" y="136" text-anchor="middle">Backbone</text><text class="s" x="570" y="166" text-anchor="middle">fibra · rutas</text><text class="s" x="570" y="192" text-anchor="middle">reserva y redundancia</text><rect class="b z" x="715" y="100" width="180" height="120" rx="14"/><text class="t" x="805" y="136" text-anchor="middle">IDF / planta</text><text class="s" x="805" y="166" text-anchor="middle">switch · patch panel</text><text class="s" x="805" y="192" text-anchor="middle">etiquetado</text><rect class="b y" x="950" y="100" width="120" height="120" rx="14"/><text class="t" x="1010" y="136" text-anchor="middle">Horizontal</text><text class="s" x="1010" y="166" text-anchor="middle">cobre</text><text class="s" x="1010" y="192" text-anchor="middle">puesto / AP</text><rect class="b" x="60" y="285" width="300" height="110" rx="14"/><text class="t" x="210" y="319" text-anchor="middle">Cobre</text><text class="s" x="210" y="348" text-anchor="middle">distancia corta · PoE · EMI</text><text class="s" x="210" y="373" text-anchor="middle">canal típico 90 m + latiguillos</text><rect class="b x" x="400" y="285" width="300" height="110" rx="14"/><text class="t" x="550" y="319" text-anchor="middle">Fibra</text><text class="s" x="550" y="348" text-anchor="middle">backbone · distancia · capacidad</text><text class="s" x="550" y="373" text-anchor="middle">monomodo / multimodo · óptica</text><rect class="b z" x="740" y="285" width="300" height="110" rx="14"/><text class="t" x="890" y="319" text-anchor="middle">Verificación</text><text class="s" x="890" y="348" text-anchor="middle">separación · limpieza · certificación</text><text class="s" x="890" y="373" text-anchor="middle">documentación · capacidad futura</text><text class="s" x="550" y="448" text-anchor="middle">Categoría de cable, estándar Ethernet, conector y transceptor son decisiones relacionadas, no sinónimos.</text></svg>
