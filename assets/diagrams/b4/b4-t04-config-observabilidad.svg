<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Configuración, cambio, observabilidad y capacidad</title><desc id="d">Ciclo desde inventario y baseline hasta automatización, cambio, observabilidad, objetivos de servicio y planificación de capacidad.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#475569"/></marker><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Estado deseado, cambio trazable y evidencia operativa</text><path class="l" d="M175 145H205M335 145H365M495 145H525M655 145H685M815 145H845M975 145H1010M1055 195V275M1010 325H880M750 325H620M490 325H360M230 325H175"/><g><rect class="b x" x="45" y="95" width="130" height="100" rx="13"/><text class="t" x="110" y="132" text-anchor="middle">Inventario</text><text class="s" x="110" y="160" text-anchor="middle">CI y relaciones</text><rect class="b" x="205" y="95" width="130" height="100" rx="13"/><text class="t" x="270" y="132" text-anchor="middle">Baseline</text><text class="s" x="270" y="160" text-anchor="middle">estado aprobado</text><rect class="b" x="365" y="95" width="130" height="100" rx="13"/><text class="t" x="430" y="132" text-anchor="middle">Declarar</text><text class="s" x="430" y="160" text-anchor="middle">config / IaC</text><rect class="b z" x="525" y="95" width="130" height="100" rx="13"/><text class="t" x="590" y="132" text-anchor="middle">Cambiar</text><text class="s" x="590" y="160" text-anchor="middle">riesgo · rollback</text><rect class="b y" x="685" y="95" width="130" height="100" rx="13"/><text class="t" x="750" y="132" text-anchor="middle">Validar</text><text class="s" x="750" y="160" text-anchor="middle">servicio y drift</text><rect class="b" x="845" y="95" width="130" height="100" rx="13"/><text class="t" x="910" y="132" text-anchor="middle">Observar</text><text class="s" x="910" y="160" text-anchor="middle">métricas · logs · trazas</text><rect class="b x" x="1010" y="95" width="90" height="100" rx="13"/><text class="t" x="1055" y="132" text-anchor="middle">SLI</text><text class="s" x="1055" y="160" text-anchor="middle">medir</text></g><rect class="b x" x="880" y="275" width="220" height="100" rx="13"/><text class="t" x="990" y="312" text-anchor="middle">SLO / SLA</text><text class="s" x="990" y="340" text-anchor="middle">objetivo / compromiso</text><rect class="b z" x="620" y="275" width="220" height="100" rx="13"/><text class="t" x="730" y="312" text-anchor="middle">Cuello y saturación</text><text class="s" x="730" y="340" text-anchor="middle">latencia · colas · error</text><rect class="b" x="360" y="275" width="220" height="100" rx="13"/><text class="t" x="470" y="312" text-anchor="middle">Prever demanda</text><text class="s" x="470" y="340" text-anchor="middle">tendencia · estacionalidad</text><rect class="b y" x="100" y="275" width="220" height="100" rx="13"/><text class="t" x="210" y="312" text-anchor="middle">Decidir capacidad</text><text class="s" x="210" y="340" text-anchor="middle">headroom · coste · límite</text><text class="s" x="550" y="435" text-anchor="middle">Monitorización detecta lo conocido; observabilidad ayuda a explicar el estado interno.</text></svg>
