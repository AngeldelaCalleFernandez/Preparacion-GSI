<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="t d"><title id="t">Generaciones móviles y UEM</title><desc id="d">Evolución desde 2G hasta 5G-Advanced y controles de gestión unificada de dispositivos.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 17px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:4;fill:none}</style></defs><rect class="g" width="1100" height="490" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">La red evoluciona; la organización gobierna el endpoint</text><path class="l" d="M100 145H1000"/><g><circle cx="130" cy="145" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text class="t" x="130" y="151" text-anchor="middle">2G</text><circle cx="340" cy="145" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text class="t" x="340" y="151" text-anchor="middle">3G</text><circle cx="550" cy="145" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text class="t" x="550" y="151" text-anchor="middle">4G</text><circle cx="760" cy="145" r="28" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text class="t" x="760" y="151" text-anchor="middle">5G</text><circle cx="970" cy="145" r="34" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text class="t" x="970" y="151" text-anchor="middle">5G-A</text><text class="s" x="130" y="195" text-anchor="middle">voz digital · SMS</text><text class="s" x="340" y="195" text-anchor="middle">datos generalizados</text><text class="s" x="550" y="195" text-anchor="middle">LTE · all-IP · EPC</text><text class="s" x="760" y="195" text-anchor="middle">NR · NSA / SA · 5GC</text><text class="s" x="970" y="195" text-anchor="middle">Release 18</text></g><rect class="b x" x="45" y="255" width="245" height="150" rx="15"/><text class="t" x="167" y="292" text-anchor="middle">Propiedad y privacidad</text><text class="s" x="167" y="324" text-anchor="middle">BYOD · COPE · COBO · CYOD</text><text class="s" x="167" y="352" text-anchor="middle">qué ve, controla y borra</text><text class="s" x="167" y="380" text-anchor="middle">separación personal/corporativo</text><rect class="b z" x="325" y="255" width="245" height="150" rx="15"/><text class="t" x="447" y="292" text-anchor="middle">Inscripción e identidad</text><text class="s" x="447" y="324" text-anchor="middle">enrolment · certificado · MFA</text><text class="s" x="447" y="352" text-anchor="middle">eSIM no elimina autenticación</text><text class="s" x="447" y="380" text-anchor="middle">acceso condicional</text><rect class="b y" x="605" y="255" width="450" height="150" rx="15"/><text class="t" x="830" y="292" text-anchor="middle">UEM durante el ciclo de vida</text><text class="s" x="830" y="324" text-anchor="middle">inventario · cifrado · versión · postura · apps · VPN/Wi-Fi</text><text class="s" x="830" y="352" text-anchor="middle">root/jailbreak · cumplimiento · lock/wipe · borrado selectivo</text><text class="s" x="830" y="380" text-anchor="middle">MDM gestiona dispositivo; UEM integra endpoints, contenido e identidad</text><text class="s" x="550" y="454" text-anchor="middle">5G-Advanced es evolución de 5G, no 6G; 5G no garantiza por sí sola latencia extremo a extremo.</text></svg>
