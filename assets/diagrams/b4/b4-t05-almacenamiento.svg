<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">Modelos y protección del almacenamiento</title><desc id="d">Comparación DAS, NAS, SAN y objeto, con protocolos, métricas y capas de protección.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Primero la abstracción y la carga; después la tecnología</text><rect class="b" x="35" y="85" width="235" height="145" rx="14"/><text class="t" x="152" y="122" text-anchor="middle">DAS</text><text class="s" x="152" y="154" text-anchor="middle">bloque local</text><text class="s" x="152" y="181" text-anchor="middle">SATA · SAS · NVMe</text><rect class="b x" x="295" y="85" width="235" height="145" rx="14"/><text class="t" x="412" y="122" text-anchor="middle">NAS</text><text class="s" x="412" y="154" text-anchor="middle">fichero compartido</text><text class="s" x="412" y="181" text-anchor="middle">NFS · SMB</text><rect class="b z" x="550" y="85" width="235" height="145" rx="14"/><text class="t" x="667" y="122" text-anchor="middle">SAN</text><text class="s" x="667" y="154" text-anchor="middle">bloque remoto</text><text class="s" x="667" y="181" text-anchor="middle">FC · iSCSI · NVMe-oF</text><rect class="b y" x="810" y="85" width="235" height="145" rx="14"/><text class="t" x="927" y="122" text-anchor="middle">Objeto</text><text class="s" x="927" y="154" text-anchor="middle">objeto + metadatos</text><text class="s" x="927" y="181" text-anchor="middle">API HTTP</text><rect class="b x" x="55" y="285" width="300" height="110" rx="14"/><text class="t" x="205" y="319" text-anchor="middle">Rendimiento y capacidad</text><text class="s" x="205" y="348" text-anchor="middle">IOPS · throughput · latencia · crecimiento</text><text class="s" x="205" y="373" text-anchor="middle">lectura/escritura · bloque · concurrencia</text><rect class="b z" x="390" y="285" width="300" height="110" rx="14"/><text class="t" x="540" y="319" text-anchor="middle">Disponibilidad local</text><text class="s" x="540" y="348" text-anchor="middle">RAID · multipath · controladoras</text><text class="s" x="540" y="373" text-anchor="middle">snapshot · thin · tiering</text><rect class="b y" x="725" y="285" width="300" height="110" rx="14"/><text class="t" x="875" y="319" text-anchor="middle">Recuperabilidad</text><text class="s" x="875" y="348" text-anchor="middle">réplica · copia independiente</text><text class="s" x="875" y="373" text-anchor="middle">inmutabilidad · restore probado</text><text class="s" x="540" y="448" text-anchor="middle">RAID ≠ backup · snapshot ≠ copia independiente · IOPS ≠ throughput</text></svg>
