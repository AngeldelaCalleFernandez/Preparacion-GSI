<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="t d"><title id="t">Señalización y medios VoIP</title><desc id="d">SIP y SDP controlan la sesión mientras RTP y RTCP transportan y supervisan los medios.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:4;fill:none}.m{stroke:#16a34a;stroke-width:5;fill:none}</style></defs><rect class="g" width="1080" height="470" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Control de sesión y audio siguen caminos lógicos distintos</text><rect class="b x" x="45" y="160" width="180" height="140" rx="16"/><text class="t" x="135" y="198" text-anchor="middle">Terminal A</text><text class="s" x="135" y="230" text-anchor="middle">codec · micrófono</text><text class="s" x="135" y="258" text-anchor="middle">identidad</text><rect class="b z" x="320" y="95" width="440" height="120" rx="16"/><text class="t" x="540" y="132" text-anchor="middle">Señalización</text><text class="s" x="540" y="164" text-anchor="middle">SIP registra, inicia, modifica y termina</text><text class="s" x="540" y="190" text-anchor="middle">SDP describe codecs, puertos y medios · TLS puede proteger SIP</text><rect class="b y" x="320" y="270" width="440" height="120" rx="16"/><text class="t" x="540" y="307" text-anchor="middle">Medios</text><text class="s" x="540" y="339" text-anchor="middle">RTP transporta voz/vídeo · RTCP aporta estadísticas</text><text class="s" x="540" y="365" text-anchor="middle">SRTP protege medios · QoS prioriza durante congestión</text><rect class="b x" x="855" y="160" width="180" height="140" rx="16"/><text class="t" x="945" y="198" text-anchor="middle">Terminal B</text><text class="s" x="945" y="230" text-anchor="middle">codec común</text><text class="s" x="945" y="258" text-anchor="middle">jitter buffer</text><path class="l" d="M225 195L320 155M760 155L855 195"/><path class="m" d="M225 265L320 330M760 330L855 265"/><text class="s" x="540" y="440" text-anchor="middle">PBX/IMS controla servicios; SBC protege la frontera. SIP no transporta normalmente el audio.</text></svg>
