<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="t d"><title id="t">Capas de una WAN moderna</title><desc id="d">WDM óptico, underlays Internet MPLS o móvil, overlay SD-WAN y protocolos de routing.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#ede9fe;stroke:#7c3aed}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1080" height="480" rx="22"/><text class="h" x="540" y="43" text-anchor="middle">Óptica, transporte, overlay y routing no son la misma capa</text><rect class="b y" x="60" y="80" width="960" height="70" rx="14"/><text class="t" x="540" y="109" text-anchor="middle">Aplicaciones y política</text><text class="s" x="540" y="134" text-anchor="middle">SLA por aplicación · QoS · cifrado · coste · failover</text><rect class="b z" x="60" y="175" width="960" height="70" rx="14"/><text class="t" x="540" y="204" text-anchor="middle">Overlay SD-WAN</text><text class="s" x="540" y="229" text-anchor="middle">edges · túneles · controlador · selección por pérdida, jitter y latencia</text><rect class="b x" x="60" y="270" width="960" height="70" rx="14"/><text class="t" x="540" y="299" text-anchor="middle">Underlays</text><text class="s" x="540" y="324" text-anchor="middle">MPLS con etiquetas · Internet · 4G/5G · conexión cloud · diversidad física</text><rect class="b" x="60" y="365" width="960" height="70" rx="14"/><text class="t" x="540" y="394" text-anchor="middle">Fibra y WDM</text><text class="s" x="540" y="419" text-anchor="middle">CWDM / DWDM multiplexan longitudes de onda; no enrutan paquetes IP</text><text class="s" x="540" y="463" text-anchor="middle">OSPF/IS-IS: IGP link-state · BGP: path-vector y políticas entre AS · MPLS no cifra por sí mismo</text></svg>
