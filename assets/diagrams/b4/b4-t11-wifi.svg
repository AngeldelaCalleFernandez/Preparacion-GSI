<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="t d"><title id="t">Diseño Wi-Fi por capacidad</title><desc id="d">Bandas, técnicas radio, planificación, roaming y seguridad empresarial de una WLAN.</desc><defs><style>.g{fill:#f8fafc}.b{fill:#fff;stroke:#334155;stroke-width:2}.x{fill:#dbeafe;stroke:#1d4ed8}.y{fill:#dcfce7;stroke:#15803d}.z{fill:#fef3c7;stroke:#b45309}.h{font:700 27px Arial;fill:#0f172a}.t{font:700 18px Arial;fill:#0f172a}.s{font:14px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:3;fill:none}</style></defs><rect class="g" width="1100" height="480" rx="22"/><text class="h" x="550" y="43" text-anchor="middle">Cobertura, capacidad y seguridad deben diseñarse juntas</text><rect class="b z" x="35" y="85" width="310" height="140" rx="14"/><text class="t" x="190" y="122" text-anchor="middle">2,4 GHz</text><text class="s" x="190" y="154" text-anchor="middle">más propagación · menos espectro</text><text class="s" x="190" y="182" text-anchor="middle">más interferencia · reutilización limitada</text><rect class="b x" x="395" y="85" width="310" height="140" rx="14"/><text class="t" x="550" y="122" text-anchor="middle">5 GHz</text><text class="s" x="550" y="154" text-anchor="middle">más canales · alta capacidad</text><text class="s" x="550" y="182" text-anchor="middle">planificar ancho, potencia y DFS</text><rect class="b y" x="755" y="85" width="310" height="140" rx="14"/><text class="t" x="910" y="122" text-anchor="middle">6 GHz</text><text class="s" x="910" y="154" text-anchor="middle">espectro adicional según regulación</text><text class="s" x="910" y="182" text-anchor="middle">Wi-Fi 6E / 7 · hasta 320 MHz</text><path class="l" d="M190 225V270H910V225"/><rect class="b" x="55" y="270" width="300" height="120" rx="14"/><text class="t" x="205" y="305" text-anchor="middle">Acceso y eficiencia</text><text class="s" x="205" y="334" text-anchor="middle">CSMA/CA · OFDMA · MIMO</text><text class="s" x="205" y="360" text-anchor="middle">canal ancho no siempre es mejor</text><rect class="b x" x="400" y="270" width="300" height="120" rx="14"/><text class="t" x="550" y="305" text-anchor="middle">Planificación</text><text class="s" x="550" y="334" text-anchor="middle">survey · SNR · densidad · roaming</text><text class="s" x="550" y="360" text-anchor="middle">canales · potencia · PoE · uplink</text><rect class="b y" x="745" y="270" width="300" height="120" rx="14"/><text class="t" x="895" y="305" text-anchor="middle">Seguridad empresarial</text><text class="s" x="895" y="334" text-anchor="middle">WPA3 · 802.1X/EAP · RADIUS</text><text class="s" x="895" y="360" text-anchor="middle">NAC · invitados · IoT separado</text><text class="s" x="550" y="442" text-anchor="middle">SSID oculto y filtrado MAC no son controles robustos; el cliente decide gran parte del roaming.</text></svg>
